name: Switch Experimental to native app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/switch-experimental-native.yml

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RHKEARTH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point Experimental navigation at native bundle
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          old = 'href="experimental.html">Experimental</a>'
          new = 'href="experimental/">Experimental</a>'
          if old not in html and new not in html:
              raise SystemExit('Experimental navigation link not found')
          html = html.replace(old, new)
          index.write_text(html)

          redirect = '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="refresh" content="0;url=experimental/"><title>Experimental // RHKEARTH</title><script>location.replace("experimental/");</script></head><body><a href="experimental/">Open Experimental</a></body></html>\n'
          Path('experimental.html').write_text(redirect)
          PY

      - name: Commit navigation switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html experimental.html
          if git diff --cached --quiet; then
            echo "Navigation already points to native Experimental app."
            exit 0
          fi
          git commit -m "Switch Experimental to native app [skip ci]"
          git push
