name: Build Experimental integrated

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-experimental-integrated.yml
      - scripts/patch-experimental-source.py
      - scripts/remove-experimental-voice.py
      - scripts/tune-experimental-cctv.py
      - scripts/add-chicago-live-cameras.py
      - scripts/add-chicago-street-activity.py
      - scripts/finalize-experimental-ui.py
      - rhkearth-logo.svg

permissions:
  contents: write

concurrency:
  group: rhkearth-experimental-integrated
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      UPSTREAM_COMMIT: 9dfb5369e8bed1531a4bb7e95e247ae9bcaf3961

    steps:
      - name: Check out RHKEARTH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Fetch pinned upstream source
        run: |
          rm -rf _gev
          git clone --filter=blob:none --no-checkout https://github.com/bilawalsidhu/gods-eye-view.git _gev
          cd _gev
          git checkout "$UPSTREAM_COMMIT"

      - name: Apply RHKEARTH source patches
        working-directory: _gev
        run: |
          python ../scripts/patch-experimental-source.py
          python ../scripts/remove-experimental-voice.py
          python ../scripts/tune-experimental-cctv.py

      - name: Install dependencies
        working-directory: _gev
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        working-directory: _gev
        run: npm run build

      - name: Adapt native bundle
        working-directory: _gev
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          dist = Path('dist')
          nested_cesium = dist / 'experimental' / 'cesium'
          target_cesium = dist / 'cesium'
          if nested_cesium.exists():
              if target_cesium.exists():
                  shutil.rmtree(target_cesium)
              shutil.move(str(nested_cesium), str(target_cesium))
              try:
                  (dist / 'experimental').rmdir()
              except OSError:
                  pass
          if not (target_cesium / 'Cesium.js').exists():
              raise SystemExit('Cesium runtime missing from dist/cesium')

          text_ext = {'.html', '.js', '.css', '.json', '.svg', '.txt', '.md'}
          replacements = {
              '/models/': '/experimental/models/',
              '"/logo.svg"': '"/experimental/logo.svg"',
              "'/logo.svg'": "'/experimental/logo.svg'",
              '"/pin.svg"': '"/experimental/pin.svg"',
              "'/pin.svg'": "'/experimental/pin.svg'",
              '"/location.svg"': '"/experimental/location.svg"',
              "'/location.svg'": "'/experimental/location.svg'",
              '"/visual-presets.svg"': '"/experimental/visual-presets.svg"',
              "'/visual-presets.svg'": "'/experimental/visual-presets.svg'",
          }
          for path in dist.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_ext:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              new = new.replace("GOD'S EYE VIEW", 'RHKEARTH EXPERIMENTAL')
              new = new.replace("God's Eye View", 'RHKEARTH Experimental')
              if new != text:
                  path.write_text(new)

          index = dist / 'index.html'
          html = index.read_text()
          if 'name="robots"' not in html:
              html = html.replace('<head>', '<head>\n<meta name="robots" content="noindex,nofollow,noarchive">', 1)
          index.write_text(html)

          brand = Path('../rhkearth-logo.svg')
          (dist / 'logo.svg').write_text(brand.read_text())

          for source, target in [
              ('LICENSE', 'UPSTREAM_LICENSE.txt'),
              ('DATA_SOURCES.md', 'DATA_SOURCES.md'),
              ('public/models/README.md', 'MODEL_ATTRIBUTIONS.md'),
          ]:
              src = Path(source)
              if src.exists():
                  (dist / target).write_text(src.read_text())

          live_src = Path('../experimental-data')
          live_dst = dist / 'live-data'
          if live_dst.exists():
              shutil.rmtree(live_dst)
          if not live_src.exists():
              raise SystemExit('experimental-data directory is missing')
          shutil.copytree(live_src, live_dst)
          PY

      - name: Browser and Chicago integration smoke test
        working-directory: _gev
        run: |
          python -m pip install --disable-pip-version-check --quiet selenium
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/rhkearth-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID >/dev/null 2>&1 || true' EXIT

          READY=0
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4173/experimental/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/rhkearth-preview.log || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:4173/experimental/cesium/Cesium.js >/dev/null
          curl -fsS http://127.0.0.1:4173/experimental/live-data/military.json >/dev/null
          curl -fsS http://127.0.0.1:4173/experimental/live-data/celestrak/stations >/dev/null
          curl -fsS http://127.0.0.1:4173/experimental/live-data/launches.json >/dev/null
          curl -fsS http://127.0.0.1:4173/experimental/live-data/chicago-live-cameras.json >/dev/null
          curl -fsS http://127.0.0.1:4173/experimental/live-data/chicago-street-activity.json >/dev/null

          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.set_capability('goog:loggingPrefs', {'browser': 'ALL'})

          driver = webdriver.Chrome(options=opts)
          driver.set_script_timeout(120)
          wait = WebDriverWait(driver, 35)
          try:
              driver.set_window_size(1440, 1000)
              driver.get('http://127.0.0.1:4173/experimental/')
              wait.until(lambda d: 'RHKEARTH' in (d.title or '').upper())
              wait.until(lambda d: d.execute_script('return !!window.__godsEyeView?.viewer && !!window.__godsEyeView?.dataManager'))
              wait.until(lambda d: 'hidden' in (d.find_element(By.ID, 'loading-screen').get_attribute('class') or '').split())

              canvas = driver.find_element(By.CSS_SELECTOR, '#cesiumContainer canvas')
              w, h = driver.execute_script('const r=arguments[0].getBoundingClientRect(); return [r.width,r.height]', canvas)
              if w < 300 or h < 200:
                  raise AssertionError(f'Cesium canvas unusable: {w}x{h}')

              voice_state = driver.execute_script('return { commands: window.__godsEyeView?.voiceCommands, ui: !!document.getElementById("gev-voice-control") }')
              if voice_state.get('commands') is not None or voice_state.get('ui'):
                  raise AssertionError(f'Voice control was not removed: {voice_state}')

              duplicate_layers = driver.execute_script('''
                const dm = window.__godsEyeView.dataManager;
                return {
                  camera: dm.layers.has('chicago-live-cameras'),
                  street: dm.layers.has('chicago-street-activity'),
                  cameraRow: !!document.querySelector('[data-layer-id="chicago-live-cameras"]'),
                  streetRow: !!document.querySelector('[data-layer-id="chicago-street-activity"]'),
                };
              ''')
              if any(duplicate_layers.values()):
                  raise AssertionError(f'Chicago duplicated as standalone layers: {duplicate_layers}')

              regional = driver.execute_async_script('''
                const done = arguments[arguments.length - 1];
                (async () => {
                  const app = window.__godsEyeView;
                  const Cesium = window.Cesium;
                  app.viewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(-87.6298, 41.8781, 14000),
                    orientation: { heading: 0, pitch: -Cesium.Math.PI_OVER_TWO, roll: 0 },
                  });
                  await new Promise(r => setTimeout(r, 900));
                  await app.dataManager.setEnabled('cctv', true, { origin: 'user' });
                  await app.dataManager.setEnabled('traffic', true, { origin: 'user' });
                  await new Promise(r => setTimeout(r, 3500));
                  const cctv = app.dataManager.layers.get('cctv')?.module?.getStats?.() || {};
                  const traffic = app.dataManager.layers.get('traffic')?.module?.getStats?.() || {};
                  done({ cctv, traffic });
                })().catch(e => done({ error: String(e?.stack || e) }));
              ''')
              print('Chicago regional stats:', regional)
              if regional.get('error'):
                  raise AssertionError(regional['error'])

              cctv_regional = (regional.get('cctv') or {}).get('regional') or {}
              traffic_regional = (regional.get('traffic') or {}).get('regional') or {}
              cam = cctv_regional.get('rhk-chicago-cctv-addon') or {}
              street = traffic_regional.get('rhk-chicago-street-addon') or {}
              if int(cam.get('visibleCount') or 0) < 1:
                  raise AssertionError(f'Chicago CCTV did not render through CCTV owner: {cam}')
              if int(street.get('visibleCount') or 0) < 1:
                  raise AssertionError(f'Chicago street activity did not render through Traffic owner: {street}')

              # Move well away from Chicago; regional records must leave the scene.
              gated = driver.execute_async_script('''
                const done = arguments[arguments.length - 1];
                const app = window.__godsEyeView;
                const Cesium = window.Cesium;
                app.viewer.camera.setView({
                  destination: Cesium.Cartesian3.fromDegrees(-0.1276, 51.5072, 14000),
                  orientation: { heading: 0, pitch: -Cesium.Math.PI_OVER_TWO, roll: 0 },
                });
                setTimeout(() => {
                  const c = app.dataManager.layers.get('cctv')?.module?.getStats?.()?.regional?.['rhk-chicago-cctv-addon'] || {};
                  const t = app.dataManager.layers.get('traffic')?.module?.getStats?.()?.regional?.['rhk-chicago-street-addon'] || {};
                  done({ c: c.visibleCount || 0, t: t.visibleCount || 0 });
                }, 1200);
              ''')
              if int(gated.get('c') or 0) != 0 or int(gated.get('t') or 0) != 0:
                  raise AssertionError(f'Chicago regional data remained rendered outside Chicago: {gated}')

              serious = []
              for entry in driver.get_log('browser'):
                  msg = entry.get('message', '')
                  if any(token in msg for token in ['Uncaught ', 'SyntaxError', 'ReferenceError']):
                      serious.append(msg)
              if serious:
                  raise AssertionError('Runtime JavaScript errors: ' + ' | '.join(serious[:5]))

              print('PASS: RHKEARTH boot + Chicago folded into CCTV/Traffic + viewport gating + voice removed')
          finally:
              driver.quit()
          PY

      - name: Publish integrated native app
        run: |
          mkdir -p /tmp/rhkearth-shell
          cp experimental/rhkearth-runtime.js /tmp/rhkearth-shell/rhkearth-runtime.js
          cp experimental/rhkearth-theme.css /tmp/rhkearth-shell/rhkearth-theme.css

          rm -rf experimental
          mkdir -p experimental
          cp -a _gev/dist/. experimental/
          cp /tmp/rhkearth-shell/rhkearth-runtime.js experimental/rhkearth-runtime.js
          cp /tmp/rhkearth-shell/rhkearth-theme.css experimental/rhkearth-theme.css
          python scripts/finalize-experimental-ui.py

          test -f experimental/index.html
          test -f experimental/cesium/Cesium.js
          test -s experimental/live-data/military.json
          test -s experimental/live-data/chicago-live-cameras.json
          test -s experimental/live-data/chicago-street-activity.json
          test -f experimental/rhkearth-runtime.js
          test -f experimental/rhkearth-theme.css
          printf '%s\n' "Native RHKEARTH Experimental build. Chicago continuous-live cameras are owned by CCTV; Chicago CDOT street activity is owned by Traffic; both are viewport-gated. Scope, Scenes and voice control removed." > experimental/RHKEARTH_BUILD.txt

      - name: Commit integrated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/rhkearth-experimental-built
          cp -a experimental /tmp/rhkearth-experimental-built

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            rm -rf experimental
            cp -a /tmp/rhkearth-experimental-built experimental
            git add experimental
            if git diff --cached --quiet; then
              echo "No Experimental bundle changes."
              exit 0
            fi
            git commit -m "Publish RHKEARTH Experimental native build [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "Remote advanced during publish; retrying against latest main."
          done
          echo "Could not publish Experimental bundle after three attempts."
          exit 1
