name: Build Experimental integrated

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-experimental-integrated.yml
      - scripts/patch-experimental-source.py
      - scripts/patch-live-runtime.py
      - scripts/patch-flight-trails-models.py
      - scripts/patch-entity-details.py
      - scripts/patch-ais-area-limit.py
      - scripts/patch-submarine-cables-osm.py
      - scripts/patch-noir-default.py
      - scripts/patch-tactical-map-palette.py
      - scripts/clean-experimental-ui-source.py
      - scripts/remove-experimental-voice.py
      - scripts/rhkearth-weather.js
      - scripts/rhkearth-weather.css
      - scripts/rhkearth-weather-fallback.js
      - scripts/rhkearth-weather-worldwide.js
      - scripts/rhkearth-mobile.js
      - scripts/rhkearth-mobile.css
      - scripts/finalize-experimental-ui.py
      - scripts/rhkearth-iran-monitor.js
      - scripts/rhkearth-iran-monitor.css
      - rhkearth-logo.svg

permissions:
  contents: write

concurrency:
  group: rhkearth-experimental-integrated
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      UPSTREAM_COMMIT: 9dfb5369e8bed1531a4bb7e95e247ae9bcaf3961

    steps:
      - name: Check out RHKEARTH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Fetch pinned upstream source
        run: |
          rm -rf _gev
          git clone --filter=blob:none --no-checkout https://github.com/bilawalsidhu/gods-eye-view.git _gev
          cd _gev
          git checkout "$UPSTREAM_COMMIT"

      - name: Apply RHKEARTH source patches
        working-directory: _gev
        run: |
          python ../scripts/patch-experimental-source.py
          python ../scripts/patch-live-runtime.py
          python ../scripts/patch-flight-trails-models.py
          python ../scripts/patch-entity-details.py
          python ../scripts/patch-ais-area-limit.py
          python ../scripts/patch-submarine-cables-osm.py
          python ../scripts/patch-noir-default.py
          python ../scripts/patch-tactical-map-palette.py
          python ../scripts/clean-experimental-ui-source.py
          python ../scripts/remove-experimental-voice.py

          grep -q "https://api.adsb.lol/v2/point" src/data/flights.js
          grep -q "normalizeAdsbLolPointResponse" src/data/flights.js
          grep -q "viewport · up to 250 nm" src/data/flights.js
          grep -q "trace_full_" src/data/flights.js
          grep -q "ICAO .*originCountry" src/data/flights.js || grep -q "originCountry" src/data/flights.js
          grep -q "CLIMB +" src/data/flights.js
          grep -q "showPoints: true" src/data/rocketLaunches.js
          grep -q "fastjet:    { url: '/models/jet.glb'" src/data/aircraftClass.js
          grep -q "CALL .*callsign" src/data/aisLiveVessels.js || grep -q "record.callsign" src/data/aisLiveVessels.js
          grep -q "DRAFT" src/data/aisLiveVessels.js
          grep -q "RHKEARTH_AIS_GLOBAL_STATION_SEED_V5" src/data/aisLiveVessels.js
          grep -q "AIS_STATIONS_URL" src/data/aisLiveVessels.js
          grep -q "fetchGlobalAisSeed" src/data/aisLiveVessels.js
          grep -q "fetchAisStationRows" src/data/aisLiveVessels.js
          grep -q "fetchGlobalAisBatch" src/data/aisLiveVessels.js
          grep -q "mergeGlobalAisRows" src/data/aisLiveVessels.js
          grep -q "AIS_TILE_BATCH = 12" src/data/aisLiveVessels.js
          grep -q "AIS_ROW_MAX_AGE_SEC" src/data/aisLiveVessels.js
          grep -q "url.searchParams.set('bbox'" src/data/aisLiveVessels.js
          grep -q "RHKEARTH_OSM_SUBMARINE_CABLES_V1" src/data/telegeographySubmarineCables.js
          grep -q "OpenStreetMap · ODbL" src/data/telegeographySubmarineCables.js
          grep -q "submarine-cables-osm" src/data/dataCredits.js
          grep -q "RHKEARTH precision trackpad navigation" src/main.js
          grep -q "overpass.kumi.systems" src/data/traffic.js
          grep -q "this.activeStyle = 'normal'" src/ui.js
          grep -q "tacticalAccent = smoothstep" src/styles/noir.js
          grep -q "#72C9D8" src/data/flights.js
          grep -q "#D8A84E" src/data/militaryFlights.js
          grep -q "#63C5D0" src/data/vesselLabels.js
          grep -q "  noir: {" src/overlays/worldOverlayTokens.js
          grep -q "rhkearth-chrome-cleanup" index.html

      - name: Install dependencies
        working-directory: _gev
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        working-directory: _gev
        run: npm run build

      - name: Adapt native bundle
        working-directory: _gev
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          dist = Path('dist')
          nested_cesium = dist / 'experimental' / 'cesium'
          target_cesium = dist / 'cesium'
          if nested_cesium.exists():
              if target_cesium.exists(): shutil.rmtree(target_cesium)
              shutil.move(str(nested_cesium), str(target_cesium))
              try: (dist / 'experimental').rmdir()
              except OSError: pass
          if not (target_cesium / 'Cesium.js').exists(): raise SystemExit('Cesium runtime missing from dist/cesium')
          text_ext = {'.html', '.js', '.css', '.json', '.svg', '.txt', '.md'}
          replacements = {
              '/models/': '/experimental/models/', '"/logo.svg"': '"/experimental/logo.svg"', "'/logo.svg'": "'/experimental/logo.svg'",
              '"/pin.svg"': '"/experimental/pin.svg"', "'/pin.svg'": "'/experimental/pin.svg'", '"/location.svg"': '"/experimental/location.svg"',
              "'/location.svg'": "'/experimental/location.svg'", '"/visual-presets.svg"': '"/experimental/visual-presets.svg"',
              "'/visual-presets.svg'": "'/experimental/visual-presets.svg'",
          }
          for path in dist.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_ext: continue
              try: text = path.read_text()
              except UnicodeDecodeError: continue
              new = text
              for old, repl in replacements.items(): new = new.replace(old, repl)
              new = new.replace("GOD'S EYE VIEW", 'RHKEARTH EXPERIMENTAL').replace("God's Eye View", 'RHKEARTH Experimental')
              if new != text: path.write_text(new)
          index = dist / 'index.html'
          html = index.read_text()
          if 'name="robots"' not in html: html = html.replace('<head>', '<head>\n<meta name="robots" content="noindex,nofollow,noarchive">', 1)
          index.write_text(html)
          (dist / 'logo.svg').write_text(Path('../rhkearth-logo.svg').read_text())
          for source, target in [('LICENSE','UPSTREAM_LICENSE.txt'),('DATA_SOURCES.md','DATA_SOURCES.md'),('public/models/README.md','MODEL_ATTRIBUTIONS.md')]:
              src = Path(source)
              if src.exists(): (dist / target).write_text(src.read_text())
          live_src = Path('../experimental-data'); live_dst = dist / 'live-data'
          if live_dst.exists(): shutil.rmtree(live_dst)
          if not live_src.exists(): raise SystemExit('experimental-data directory is missing')
          shutil.copytree(live_src, live_dst)
          PY

      - name: Static native integrity gate
        working-directory: _gev
        run: |
          test -f dist/index.html
          test -f dist/cesium/Cesium.js
          test -s dist/live-data/military.json
          test -s dist/live-data/celestrak/stations
          test -s dist/live-data/launches.json
          grep -q "id=\"active-style-name\">NORMAL\|id=\"active-style-name\">NORMAL<" dist/index.html
          grep -q "rhkearth-chrome-cleanup" dist/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          index = Path('dist/index.html').read_text()
          if 'RHKEARTH' not in index.upper(): raise SystemExit('RHKEARTH branding missing from built index')
          if 'NORMAL' not in index: raise SystemExit('Normal first-paint state missing from built index')
          print('PASS static native gate: non-camera layers preserved')
          PY

      - name: Publish integrated native app
        run: |
          mkdir -p /tmp/rhkearth-shell
          cp experimental/rhkearth-runtime.js /tmp/rhkearth-shell/rhkearth-runtime.js
          cp experimental/rhkearth-theme.css /tmp/rhkearth-shell/rhkearth-theme.css
          rm -rf experimental
          mkdir -p experimental
          cp -a _gev/dist/. experimental/
          cp /tmp/rhkearth-shell/rhkearth-runtime.js experimental/rhkearth-runtime.js
          cp /tmp/rhkearth-shell/rhkearth-theme.css experimental/rhkearth-theme.css
          python scripts/finalize-experimental-ui.py
          test -f experimental/index.html
          test -f experimental/cesium/Cesium.js
          test -s experimental/live-data/military.json
          test -f experimental/rhkearth-runtime.js
          test -f experimental/rhkearth-theme.css
          test -f experimental/rhkearth-mobile.js
          test -f experimental/rhkearth-mobile.css
          test -f experimental/rhkearth-weather.js
          test -f experimental/rhkearth-weather-worldwide.js
          grep -q "rhkearth-mobile.js?v=1" experimental/index.html
          grep -q "rhkearth-mobile.css?v=2" experimental/index.html
          grep -q "rhkearth-weather-worldwide.js?v=1" experimental/index.html
          grep -q "rhkearth-chrome-cleanup" experimental/index.html
          printf '%s\n' "Native RHKEARTH Experimental build. Maritime seeds worldwide AIS from the Open Waters global station catalog and station vessel snapshots before using bounded tiles for ongoing live refresh; vessel state is retained/deduplicated by MMSI. Submarine Cables use RHKEARTH-hosted OpenStreetMap ODbL snapshots when available, with browser Overpass only as fallback." > experimental/RHKEARTH_BUILD.txt

      - name: Commit integrated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/rhkearth-experimental-built
          cp -a experimental /tmp/rhkearth-experimental-built
          for attempt in 1 2 3; do
            echo "Publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            rm -rf experimental
            cp -a /tmp/rhkearth-experimental-built experimental
            git add experimental
            if git diff --cached --quiet; then echo "No Experimental bundle changes."; exit 0; fi
            git commit -m "Publish RHKEARTH Experimental native build [skip ci]"
            if git push origin main; then exit 0; fi
            echo "Remote advanced during publish; retrying against latest main."
          done
          echo "Could not publish Experimental bundle after three attempts."
          exit 1