name: Probe remaining US camera media endpoints

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/probe-remaining-us-camera-media.yml

permissions:
  contents: read

jobs:
  probe-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public media endpoints
        run: |
          python - <<'PY'
          import json,re,urllib.request,urllib.parse
          UA='RHKEARTH/1.0 (+https://rhkearth.com/experimental/)'
          def grab(url,timeout=25):
              q=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              with urllib.request.urlopen(q,timeout=timeout) as r:return r.read(),dict(r.headers),r.geturl()

          print('=== RI cameras.js ===')
          try:
              raw,h,u=grab('https://www.dot.ri.gov/travel/cameras.js')
              txt=raw.decode('utf-8','replace')
              print('bytes',len(raw),'head',re.sub(r'\s+',' ',txt[:10000]))
              print('http urls',re.findall(r'https?://[^"\'<>\s]+',txt)[:80])
          except Exception as e:print('ERR',e)

          print('\n=== Maryland media ===')
          try:
              d=json.loads(grab('https://chartexp1.sha.maryland.gov/CHARTExportClientService/getCameraMapDataJSON.do')[0])
              cam=next(x for x in d.get('data',[]) if x.get('publicVideoURL'))
              url=cam['publicVideoURL']; raw,h,final=grab(url)
              print('url',url,'final',final,'bytes',len(raw),'content-type',h.get('Content-Type'),'x-frame',h.get('X-Frame-Options'),'csp',h.get('Content-Security-Policy'))
              print('head',raw[:1200].decode('utf-8','replace').replace('\n',' '))
          except Exception as e:print('ERR',e)

          print('\n=== Alabama sample image ===')
          try:
              cams=json.loads(grab('https://api.algotraffic.com/v4.0/cameras')[0]); url=cams[0]['snapshotImageUrl']; raw,h,final=grab(url)
              print(url,len(raw),h.get('Content-Type'),raw[:12])
          except Exception as e:print('ERR',e)

          print('\n=== South Carolina sample image ===')
          try:
              d=json.loads(grab('https://sc.cdn.iteris-atis.com/geojson/icons/metadata/icons.cameras.geojson')[0]); p=d['features'][0]['properties']; url=p['image_url']; raw,h,final=grab(url)
              print(url,len(raw),h.get('Content-Type'),raw[:12])
          except Exception as e:print('ERR',e)

          print('\n=== Hawaii config / source hints ===')
          try:
              raw,h,u=grab('https://goakamai.org/data/config.json'); txt=raw.decode('utf-8','replace');print('CONFIG',txt[:12000])
          except Exception as e:print('CONFIG ERR',e)
          for path in ['/icxtg/b132639.js','/icxtg/4e5deba.js','/icxtg/f095ff7.js','/icxtg/a168b34.js','/include/javascript/icx/icx-atis-map.dfe023100406ffffcda5.js']:
              try:
                  txt=grab('https://goakamai.org'+path)[0].decode('utf-8','replace')
                  hits=[]
                  for pat in ['camera','Camera','cctv','CCTV','stream','snapshot','endpoint','geojson']:
                      for m in list(re.finditer(pat,txt,re.I))[:3]:hits.append(txt[max(0,m.start()-180):m.start()+500].replace('\n',' '))
                  print('BUNDLE',path,'bytes',len(txt),'HITS',hits[:12])
              except Exception as e:print('BUNDLE ERR',path,e)

          print('\n=== Wyoming page structure hints ===')
          try:
              txt=grab('https://www.wyoroad.info/pls/Browse/WRR.Cameras')[0].decode('utf-8','replace')
              print('lat/lon tokens',len(re.findall(r'lat(?:itude)?|lon(?:gitude)?',txt,re.I)))
              for pat in ['web-cam/cache','site=','Latitude','Longitude','GPS']:
                  m=re.search(pat,txt,re.I)
                  if m:print('HIT',pat,re.sub(r'\s+',' ',txt[max(0,m.start()-500):m.start()+1200]))
          except Exception as e:print('ERR',e)
          PY
