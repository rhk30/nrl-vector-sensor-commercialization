name: Probe Chicago camera source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-chicago-camera-source.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect TravelMidwest camera payload
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = 'https://www.travelmidwest.com/lmiga/cameraReport.json'
          req = urllib.request.Request(url, headers={
              'User-Agent': 'RHKEARTH/1.0 (+https://rhkearth.com/experimental/)',
              'Accept': 'application/json,*/*',
          })
          with urllib.request.urlopen(req, timeout=25) as r:
              raw = r.read()
              print('status', r.status, 'content-type', r.headers.get('Content-Type'), 'bytes', len(raw))
          data = json.loads(raw.decode('utf-8'))
          print('root type', type(data).__name__)
          if isinstance(data, dict):
              print('root keys', list(data.keys())[:100])
              for key, value in data.items():
                  print('KEY', key, 'TYPE', type(value).__name__, 'LEN', len(value) if hasattr(value, '__len__') else '-')
                  if isinstance(value, list) and value:
                      print('FIRST LIST ITEM', json.dumps(value[0], ensure_ascii=False)[:5000])
                  elif isinstance(value, dict):
                      print('DICT KEYS', list(value.keys())[:100])
                      for k2, v2 in value.items():
                          if isinstance(v2, list) and v2:
                              print('NESTED LIST', key, k2, 'LEN', len(v2), 'FIRST', json.dumps(v2[0], ensure_ascii=False)[:5000])
                              break
          elif isinstance(data, list):
              print('list len', len(data))
              if data:
                  print('first', json.dumps(data[0], ensure_ascii=False)[:5000])
          PY
