name: Expand Worldwide public cameras

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/expand-worldwide-cameras.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/expand-worldwide-cameras.yml
  workflow_run:
    workflows: ["Refresh Worldwide public cameras"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: rhkearth-worldwide-camera-expansion
  cancel-in-progress: true

jobs:
  expand:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out RHKEARTH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge additional public-camera networks
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import quote, urljoin
          import hashlib
          import json
          import re
          import time
          import urllib.request

          BASE = Path('experimental-data/worldwide-cameras.json')
          CACHE = Path('experimental-data/worldwide-cameras-expanded-cache.json')
          OUT = Path('experimental-data/worldwide-cameras.json')
          LIVE = Path('experimental/live-data/worldwide-cameras.json')
          UA = 'RHKEARTH/1.0 (+https://rhkearth.com/experimental/; public-camera catalog expansion)'
          now_ms = int(datetime.now(timezone.utc).timestamp() * 1000)

          if not BASE.exists():
              raise SystemExit('Base worldwide camera catalog is missing')

          base_bytes = BASE.read_bytes()
          base_hash = hashlib.sha256(base_bytes).hexdigest()
          base = json.loads(base_bytes.decode('utf-8'))
          base_rows = base.get('sources') if isinstance(base, dict) else []
          base_rows = base_rows if isinstance(base_rows, list) else []
          if len(base_rows) < 100:
              raise SystemExit(f'Base worldwide camera catalog is unexpectedly small: {len(base_rows)}')

          try:
              previous = json.loads(CACHE.read_text(encoding='utf-8')) if CACHE.exists() else {}
          except Exception:
              previous = {}
          previous_rows = previous.get('sources') if isinstance(previous, dict) else []
          previous_rows = previous_rows if isinstance(previous_rows, list) else []
          previous_by_provider = {}
          for row in previous_rows:
              previous_by_provider.setdefault(str(row.get('provider') or ''), []).append(row)

          def request(url, *, accept='application/json,*/*', headers=None, timeout=25, attempts=2):
              last = None
              merged = {
                  'User-Agent': UA,
                  'Accept': accept,
                  'X-Requested-With': 'XMLHttpRequest',
              }
              if headers:
                  merged.update(headers)
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=merged)
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          if response.status < 200 or response.status >= 300:
                              raise RuntimeError(f'HTTP {response.status}')
                          return response.read()
                  except Exception as exc:
                      last = exc
                      if attempt + 1 < attempts:
                          time.sleep(1.25 * (attempt + 1))
              raise RuntimeError(f'{url}: {last}')

          def get_json(url, **kwargs):
              return json.loads(request(url, **kwargs).decode('utf-8'))

          extra = []
          provider_counts = {}
          provider_status = {}

          def add(provider, camera_id, lat, lon, name, url, *, city='', country='US',
                  refresh_ms=20000, source_kind='official-public-camera'):
              try:
                  lat = float(lat)
                  lon = float(lon)
              except (TypeError, ValueError):
                  return False
              url = str(url or '').strip()
              if not (-90 <= lat <= 90 and -180 <= lon <= 180):
                  return False
              if not url.startswith('https://'):
                  return False
              camera_id = re.sub(r'[^A-Za-z0-9_.:-]+', '-', str(camera_id or f'{lat:.5f}-{lon:.5f}'))[:180]
              extra.append({
                  'id': camera_id,
                  'name': str(name or 'Public camera')[:180],
                  'city': str(city or '')[:100],
                  'country': str(country or '')[:80],
                  'provider': provider,
                  'lat': lat,
                  'lon': lon,
                  'feedType': 'image',
                  'url': url,
                  'snapshotUrl': url,
                  'mediaUrl': url,
                  'refreshMs': int(refresh_ms),
                  'sourceKind': source_kind,
                  'liveSemantics': 'near-real-time provider-refreshed image',
              })
              return True

          def run_provider(provider, loader):
              before = len(extra)
              try:
                  loader()
                  count = len(extra) - before
                  if count <= 0:
                      raise RuntimeError('no usable cameras returned')
                  provider_counts[provider] = count
                  provider_status[provider] = 'fresh'
                  print(f'{provider}: {count} fresh')
              except Exception as exc:
                  # A loader may have appended rows before discovering a short read.
                  # Roll that partial provider back before falling back to last-good.
                  del extra[before:]
                  fallback = previous_by_provider.get(provider) or []
                  if fallback:
                      extra.extend(fallback)
                      provider_counts[provider] = len(fallback)
                      provider_status[provider] = 'last-good'
                      print(f'{provider}: refresh failed; retained {len(fallback)} last-good rows: {exc}')
                  else:
                      provider_counts[provider] = 0
                      provider_status[provider] = 'unavailable'
                      print(f'{provider}: unavailable and no last-good rows: {exc}')

          QUERY_TEMPLATE = {
              'columns': [
                  {'data': None, 'name': ''},
                  {'name': 'sortOrder', 's': True},
                  {'name': 'roadway', 's': True},
                  {'data': 3, 'name': ''},
              ],
              'order': [{'column': 1, 'dir': 'asc'}],
              'search': {'value': ''},
          }
          POINT_RE = re.compile(r'POINT\s*\(\s*(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\s*\)', re.I)
          CODE_PREFIX = re.compile(r'^[A-Z]{2,8}-?\d*\s*:\s*')

          def build_query(start, length=100):
              query = dict(QUERY_TEMPLATE)
              query['start'] = int(start)
              query['length'] = int(length)
              return quote(json.dumps(query, separators=(',', ':')))

          def parse_wkt(wkt):
              match = POINT_RE.search(str(wkt or ''))
              if not match:
                  return None
              lon = float(match.group(1))
              lat = float(match.group(2))
              if not (-90 <= lat <= 90 and -180 <= lon <= 180):
                  return None
              return lat, lon

          def camera_label(rec, provider):
              loc = str(rec.get('location') or '').strip()
              loc = CODE_PREFIX.sub('', loc)
              if loc and loc != 'N/A' and ' ' in loc:
                  return loc
              road = str(rec.get('roadway') or '').strip()
              direction = str(rec.get('direction') or '').strip()
              if road and road != 'N/A':
                  return f'{road} {direction}'.strip() if direction and direction != 'N/A' else road
              if loc and loc != 'N/A':
                  return loc
              return f'{provider} Camera {rec.get("id")}'

          def camera_city(rec, state):
              city = str(rec.get('city') or '').strip()
              if city and city != 'N/A':
                  return city
              county = str(rec.get('county') or '').strip()
              if county and county != 'N/A':
                  return county if county.lower().endswith('county') else f'{county} County'
              return state

          def fetch_ibi_page(base, start, *, lang='en', page_size=100):
              url = f'{base}/List/GetData/Cameras?query={build_query(start, page_size)}&lang={lang}'
              data = get_json(url, timeout=20, attempts=2)
              return {
                  'rows': data.get('data') if isinstance(data.get('data'), list) else [],
                  'total': int(data.get('recordsTotal') or 0),
              }

          def load_ibi511(provider, *, base, prefix, state, bounds, lang='en',
                          max_pages=60, fallback_pattern=None):
              page_size = 100
              first = fetch_ibi_page(base, 0, lang=lang, page_size=page_size)
              total = first['total']
              if total <= 0:
                  raise RuntimeError('recordsTotal was zero')

              raw_by_id = {}

              def ingest(rows):
                  for rec in rows:
                      if isinstance(rec, dict) and isinstance(rec.get('id'), int):
                          raw_by_id[rec['id']] = rec

              ingest(first['rows'])
              starts = list(range(page_size, min(total, page_size * max_pages), page_size))
              failed = []

              if starts:
                  with ThreadPoolExecutor(max_workers=8) as pool:
                      futures = {pool.submit(fetch_ibi_page, base, start, lang=lang, page_size=page_size): start for start in starts}
                      for future in as_completed(futures):
                          start = futures[future]
                          try:
                              ingest(future.result()['rows'])
                          except Exception:
                              failed.append(start)

              if failed:
                  time.sleep(0.6)
                  with ThreadPoolExecutor(max_workers=4) as pool:
                      futures = {pool.submit(fetch_ibi_page, base, start, lang=lang, page_size=page_size): start for start in failed}
                      for future in as_completed(futures):
                          try:
                              ingest(future.result()['rows'])
                          except Exception:
                              pass

              if len(raw_by_id) < total * 0.95:
                  raise RuntimeError(f'short read: {len(raw_by_id)} of {total} rows')

              min_lat, max_lat, min_lon, max_lon = bounds
              accepted = 0
              for rec in raw_by_id.values():
                  images = rec.get('images') or []
                  image = images[0] if images and isinstance(images[0], dict) else {}
                  if image.get('blocked') or image.get('disabled'):
                      continue

                  coords = parse_wkt((((rec.get('latLng') or {}).get('geography') or {}).get('wellKnownText')))
                  if not coords:
                      continue
                  lat, lon = coords
                  if not (min_lat <= lat <= max_lat and min_lon <= lon <= max_lon):
                      continue

                  snapshot = str(image.get('imageUrl') or '').strip()
                  if snapshot:
                      snapshot = urljoin(base + '/', snapshot)
                  elif fallback_pattern:
                      snapshot = fallback_pattern(base, rec)
                  if not snapshot:
                      continue

                  if add(
                      provider,
                      f'{prefix}-{rec.get("id")}',
                      lat,
                      lon,
                      camera_label(rec, provider),
                      snapshot,
                      city=camera_city(rec, state),
                      country='US',
                      refresh_ms=15000,
                      source_kind='osiris-derived-public-camera-adapter',
                  ):
                      accepted += 1

              if accepted < total * 0.90:
                  raise RuntimeError(f'usable-camera short read: {accepted} of {total}')
              print(f'{provider}: accepted {accepted} of {total}')

          def load_fdot():
              load_ibi511(
                  'FDOT / FL511',
                  base='https://fl511.com',
                  prefix='fdot',
                  state='Florida',
                  bounds=(24.4, 31.1, -87.7, -79.9),
              )

          def load_gdot():
              load_ibi511(
                  'GDOT / 511GA',
                  base='https://511ga.org',
                  prefix='gdot',
                  state='Georgia',
                  bounds=(30.3, 35.1, -85.7, -80.8),
              )

          def load_ncdot():
              load_ibi511(
                  'NCDOT / DriveNC',
                  base='https://drivenc.gov',
                  prefix='ncdot',
                  state='North Carolina',
                  bounds=(33.8, 36.6, -84.4, -75.4),
              )

          def load_adot():
              load_ibi511(
                  'ADOT / AZ511',
                  base='https://az511.gov',
                  prefix='adot',
                  state='Arizona',
                  bounds=(31.3, 37.1, -115.0, -109.0),
              )

          def load_udot():
              load_ibi511(
                  'UDOT Traffic',
                  base='https://prod-ut.ibi511.com',
                  prefix='udot',
                  state='Utah',
                  bounds=(36.9, 42.1, -114.2, -108.9),
                  lang='en-US',
                  max_pages=40,
                  fallback_pattern=lambda base, rec: f'{base}/map/Cctv/{rec.get("id")}',
              )

          def load_ndot():
              load_ibi511(
                  'NDOT / NV Roads',
                  base='https://www.nvroads.com',
                  prefix='ndot',
                  state='Nevada',
                  bounds=(34.9, 42.1, -120.1, -113.9),
                  lang='en-US',
                  max_pages=20,
              )

          def load_ladotd():
              load_ibi511(
                  'LADOTD / 511LA',
                  base='https://511la.org',
                  prefix='ladotd',
                  state='Louisiana',
                  bounds=(28.8, 33.1, -94.2, -88.6),
                  max_pages=10,
              )

          def load_tfl():
              data = get_json('https://api.tfl.gov.uk/Place/Type/JamCam', timeout=25, attempts=2)
              if not isinstance(data, list) or not data:
                  raise RuntimeError('TfL returned no JamCams')
              accepted = 0
              for cam in data:
                  props = cam.get('additionalProperties') or []
                  image = ''
                  for prop in props:
                      if str(prop.get('key') or '') == 'imageUrl' and prop.get('value'):
                          image = str(prop.get('value')).strip()
                          break
                  cid = str(cam.get('id') or '').replace('JamCams_', '')
                  if not image and cid:
                      image = f'https://s3-eu-west-1.amazonaws.com/jamcams.tfl.gov.uk/{cid}.jpg'
                  if add(
                      'TfL JamCams',
                      f'tfl-{cam.get("id") or cid}',
                      cam.get('lat'),
                      cam.get('lon'),
                      cam.get('commonName') or f'London JamCam {cid}',
                      image,
                      city='London',
                      country='United Kingdom',
                      refresh_ms=15000,
                      source_kind='official-open-data-camera',
                  ):
                      accepted += 1
              if accepted < 500:
                  raise RuntimeError(f'TfL returned only {accepted} usable cameras')
              print(f'TfL JamCams: accepted {accepted}')

          SPAIN_PROVINCES = {
              '01': 'Álava', '02': 'Albacete', '03': 'Alicante', '04': 'Almería',
              '05': 'Ávila', '06': 'Badajoz', '07': 'Baleares', '08': 'Barcelona',
              '09': 'Burgos', '10': 'Cáceres', '11': 'Cádiz', '12': 'Castellón',
              '13': 'Ciudad Real', '14': 'Córdoba', '15': 'A Coruña', '16': 'Cuenca',
              '17': 'Girona', '18': 'Granada', '19': 'Guadalajara', '20': 'Gipuzkoa',
              '21': 'Huelva', '22': 'Huesca', '23': 'Jaén', '24': 'León',
              '25': 'Lleida', '26': 'La Rioja', '27': 'Lugo', '28': 'Madrid',
              '29': 'Málaga', '30': 'Murcia', '31': 'Navarra', '32': 'Ourense',
              '33': 'Asturias', '34': 'Palencia', '35': 'Las Palmas',
              '36': 'Pontevedra', '37': 'Salamanca', '38': 'S.C. Tenerife',
              '39': 'Cantabria', '40': 'Segovia', '41': 'Sevilla', '42': 'Soria',
              '43': 'Tarragona', '44': 'Teruel', '45': 'Toledo', '46': 'Valencia',
              '47': 'Valladolid', '48': 'Bizkaia', '49': 'Zamora', '50': 'Zaragoza',
              '51': 'Ceuta', '52': 'Melilla',
          }

          def load_spain_dgt():
              data = get_json('https://www.dgt.es/.content/.assets/json/camaras.json', timeout=30, attempts=2)
              rows = data.get('camaras') if isinstance(data, dict) else []
              if not isinstance(rows, list) or not rows:
                  raise RuntimeError('Spain DGT returned no cameras')
              accepted = 0
              for cam in rows:
                  road = str(cam.get('carretera') or '').strip()
                  pk = str(cam.get('pk') or '').strip()
                  direction = str(cam.get('sentido') or '').strip()
                  direction_text = ''
                  if direction and direction != '-':
                      direction_text = f' ({direction})'
                  name = f'{road} km {pk}{direction_text}'.strip() or f'DGT Camera {cam.get("id")}'
                  if add(
                      'Spain DGT',
                      f'dgt-{cam.get("id")}',
                      cam.get('latitud'),
                      cam.get('longitud'),
                      name,
                      cam.get('imagen'),
                      city=SPAIN_PROVINCES.get(str(cam.get('provincia') or '').zfill(2), 'Spain'),
                      country='Spain',
                      refresh_ms=20000,
                      source_kind='official-open-data-camera',
                  ):
                      accepted += 1
              if accepted < 1000:
                  raise RuntimeError(f'Spain DGT returned only {accepted} usable HTTPS cameras')
              print(f'Spain DGT: accepted {accepted}')

          def load_iowa():
              url = (
                  'https://services.arcgis.com/8lRhdTsQyJpO52F1/arcgis/rest/services/'
                  'Traffic_Cameras_View/FeatureServer/0/query?'
                  'where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=2000&f=json'
              )
              data = get_json(url, timeout=30, attempts=2)
              features = data.get('features') if isinstance(data, dict) else []
              if not isinstance(features, list) or not features:
                  raise RuntimeError('Iowa DOT ArcGIS returned no features')
              accepted = 0
              for feature in features:
                  p = feature.get('attributes') or {}
                  cid = p.get('device_id') or p.get('COMMON_ID') or p.get('FID')
                  name = p.get('Desc_') or p.get('ImageName') or p.get('COMMON_ID') or f'Iowa DOT Camera {cid}'
                  if add(
                      'Iowa DOT 511',
                      f'iowa-{cid}',
                      p.get('latitude'),
                      p.get('longitude'),
                      name,
                      p.get('ImageURL'),
                      city=p.get('REGION') or 'Iowa',
                      country='US',
                      refresh_ms=15000,
                      source_kind='official-open-data-camera',
                  ):
                      accepted += 1
              if accepted < 100:
                  raise RuntimeError(f'Iowa DOT returned only {accepted} usable cameras')
              print(f'Iowa DOT 511: accepted {accepted}')

          for provider, loader in [
              ('FDOT / FL511', load_fdot),
              ('GDOT / 511GA', load_gdot),
              ('NCDOT / DriveNC', load_ncdot),
              ('ADOT / AZ511', load_adot),
              ('UDOT Traffic', load_udot),
              ('NDOT / NV Roads', load_ndot),
              ('LADOTD / 511LA', load_ladotd),
              ('TfL JamCams', load_tfl),
              ('Spain DGT', load_spain_dgt),
              ('Iowa DOT 511', load_iowa),
          ]:
              run_provider(provider, loader)

          # Exact-id dedupe within the expansion cache.
          dedup_extra = {}
          for row in extra:
              dedup_extra[str(row.get('id'))] = row
          extra = list(dedup_extra.values())

          if not extra and not previous_rows:
              raise SystemExit('No expansion camera source succeeded; preserving the existing catalog')
          if len(extra) < 500 and len(previous_rows) >= 500:
              raise SystemExit(f'Expansion catalog collapsed to {len(extra)} from {len(previous_rows)}; preserving last good state')

          merged = {}
          for row in base_rows:
              merged[str(row.get('id'))] = row
          for row in extra:
              merged[str(row.get('id'))] = row
          merged_rows = list(merged.values())

          if len(merged_rows) < len(base_rows):
              raise SystemExit('Merged camera catalog became smaller than the base catalog')

          base_providers = base.get('providers') if isinstance(base.get('providers'), dict) else {}
          all_providers = dict(base_providers)
          all_providers.update(provider_counts)

          output = dict(base)
          output.update({
              'sources': merged_rows,
              'fetchedAt': now_ms,
              'providers': all_providers,
              'renderPolicy': 'full valid catalog; no arbitrary camera-count truncation',
              'expansionArchitecture': 'Existing worldwide catalog plus fail-soft, last-good cached public-camera adapters; base refresh remains independently recoverable.',
              'expansionProviders': provider_counts,
              'expansionProviderStatus': provider_status,
              'expansionSourcePolicy': 'Official/public transportation camera sources only; compromised/private-camera directories are not ingested.',
          })

          cache_output = {
              'sources': extra,
              'fetchedAt': now_ms,
              'providers': provider_counts,
              'providerStatus': provider_status,
              'source': 'RHKEARTH additional official/public camera networks',
              'sourcePolicy': 'Public transportation/open-data camera catalogs only',
          }

          OUT.write_text(json.dumps(output, separators=(',', ':'), ensure_ascii=False) + '\n', encoding='utf-8')
          LIVE.parent.mkdir(parents=True, exist_ok=True)
          LIVE.write_text(json.dumps(output, separators=(',', ':'), ensure_ascii=False) + '\n', encoding='utf-8')
          CACHE.write_text(json.dumps(cache_output, separators=(',', ':'), ensure_ascii=False) + '\n', encoding='utf-8')
          Path('/tmp/rhkearth-camera-base.sha256').write_text(base_hash + '\n', encoding='utf-8')
          print('base cameras:', len(base_rows))
          print('expansion cameras:', len(extra))
          print('merged cameras:', len(merged_rows))
          print('expansion providers:', provider_counts)
          PY

      - name: Validate merged catalog
        run: |
          test -s experimental-data/worldwide-cameras.json
          test -s experimental-data/worldwide-cameras-expanded-cache.json
          python - <<'PY'
          import json

          merged = json.load(open('experimental-data/worldwide-cameras.json'))
          extra = json.load(open('experimental-data/worldwide-cameras-expanded-cache.json'))
          rows = merged.get('sources') or []
          extra_rows = extra.get('sources') or []

          assert len(rows) >= 100, f'only {len(rows)} total cameras'
          assert len(extra_rows) >= 1, 'expansion cache is empty'
          assert all(str(r.get('url', '')).startswith('https://') for r in extra_rows)
          assert all(-90 <= float(r['lat']) <= 90 and -180 <= float(r['lon']) <= 180 for r in extra_rows)
          assert merged.get('renderPolicy') == 'full valid catalog; no arbitrary camera-count truncation'
          assert 'expansionProviderStatus' in merged
          print('validated', len(rows), 'merged cameras with', len(extra_rows), 'expansion cameras')
          PY

      - name: Preserve generated files for safe publish
        run: |
          cp experimental-data/worldwide-cameras.json /tmp/worldwide-cameras-expanded.json
          cp experimental/live-data/worldwide-cameras.json /tmp/worldwide-cameras-expanded-live.json
          cp experimental-data/worldwide-cameras-expanded-cache.json /tmp/worldwide-cameras-expanded-cache.json

      - name: Publish expanded camera catalog
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Expanded camera publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            expected="$(cat /tmp/rhkearth-camera-base.sha256)"
            current="$(sha256sum experimental-data/worldwide-cameras.json | awk '{print $1}')"
            if [ "$current" != "$expected" ]; then
              echo "Base camera catalog advanced during expansion; refusing to overwrite a newer catalog."
              exit 0
            fi

            mkdir -p experimental-data experimental/live-data
            cp /tmp/worldwide-cameras-expanded.json experimental-data/worldwide-cameras.json
            cp /tmp/worldwide-cameras-expanded-live.json experimental/live-data/worldwide-cameras.json
            cp /tmp/worldwide-cameras-expanded-cache.json experimental-data/worldwide-cameras-expanded-cache.json
            git add experimental-data/worldwide-cameras.json experimental/live-data/worldwide-cameras.json experimental-data/worldwide-cameras-expanded-cache.json

            if git diff --cached --quiet; then
              echo "Expanded camera catalog already current."
              exit 0
            fi

            git commit -m "Expand RHKEARTH worldwide public camera catalog [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "Remote advanced; retrying expanded camera publish."
          done
          exit 1
