name: Probe additional public 511 camera backends

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/probe-ibi-us-camera-backends.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe CARS IBI camera indexes
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          UA='RHKEARTH/1.0 (+https://rhkearth.com/experimental/)'
          q={'columns':[{'data':None,'name':''},{'name':'sortOrder','s':True},{'name':'roadway','s':True},{'data':3,'name':''}],
             'order':[{'column':1,'dir':'asc'}],'search':{'value':''},'start':0,'length':5}
          enc=urllib.parse.quote(json.dumps(q,separators=(',',':')))
          hosts={
            'GA':'https://511ga.org',
            'IA':'https://www.511ia.org',
            'LA':'https://511la.org',
            'AZ':'https://az511.gov',
            'UT':'https://udottraffic.utah.gov',
            'NV':'https://www.nvroads.com',
            'FL':'https://fl511.com',
            'OK':'https://www.oktraffic.org',
            'MI':'https://mdotjboss.state.mi.us/MiDrive',
            'WV':'https://www.wv511.org',
            'TN':'https://smartway.tn.gov',
            'NC':'https://drivenc.gov',
            'OR':'https://tripcheck.com',
            'WA':'https://wsdot.com/Travel/Real-time/Map',
            'TX':'https://drivetexas.org',
          }
          for st,host in hosts.items():
              url=f'{host}/List/GetData/Cameras?query={enc}&lang=en'
              print('\n===',st,host,'===')
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,*/*','X-Requested-With':'XMLHttpRequest'})
                  with urllib.request.urlopen(req,timeout=18) as r:
                      raw=r.read(); ct=r.headers.get('Content-Type','')
                  print('STATUS bytes',len(raw),'ctype',ct)
                  txt=raw.decode('utf-8','replace')
                  if txt.lstrip().startswith(('{','[')):
                      d=json.loads(txt)
                      if isinstance(d,dict):
                          print('recordsTotal',d.get('recordsTotal'),'keys',list(d.keys())[:20])
                          arr=d.get('data') or []
                          print('sample',json.dumps(arr[:1],ensure_ascii=False)[:5000])
                      else: print('list',len(d),'sample',json.dumps(d[:1])[:3000])
                  else: print('HEAD',txt[:600])
              except Exception as e: print('ERROR',repr(e))
          PY
