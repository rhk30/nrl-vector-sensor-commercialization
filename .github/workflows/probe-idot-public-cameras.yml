name: Probe IDOT public ArcGIS cameras

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-idot-public-cameras.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Count and validate public TrafficCamerasTM view
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://services2.arcgis.com/aIrBD8yn1TDTEXoz/arcgis/rest/services/TrafficCamerasTM_Public/FeatureServer/0/query'
          all_rows=[]
          offset=0
          while offset < 10000:
            params={
              'where':'y > 36.9 AND y < 42.6 AND x > -91.6 AND x < -87.0',
              'outFields':'OBJECTID,ImgPath,CameraLocation,CameraDirection,y,x,SnapShot,WarningAge,TooOld,AgeInMinutes',
              'returnGeometry':'true','outSR':'4326','f':'json','resultRecordCount':'1000',
              'resultOffset':str(offset),'orderByFields':'OBJECTID ASC'
            }
            url=base+'?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={'User-Agent':'RHKEARTH/1.0 public-camera-probe','Accept':'application/json,*/*'})
            with urllib.request.urlopen(req,timeout=30) as r:
              data=json.loads(r.read().decode())
            rows=data.get('features') or []
            print('PAGE',offset,'FEATURES',len(rows),'EXCEEDED',data.get('exceededTransferLimit'),'ERROR',data.get('error'))
            if data.get('error'): raise SystemExit(data['error'])
            all_rows.extend(rows)
            if len(rows)<1000 and not data.get('exceededTransferLimit'): break
            if not rows: break
            offset += len(rows)
          groups={}
          for f in all_rows:
            a=f.get('attributes') or {}
            try: lat=float(a.get('y')); lon=float(a.get('x'))
            except: continue
            name=str(a.get('CameraLocation') or '').strip()
            url=str(a.get('SnapShot') or '').strip()
            if not name or not url.startswith('https://'): continue
            key=(round(lat,6),round(lon,6),name)
            groups.setdefault(key,[]).append((str(a.get('CameraDirection') or ''),url,str(a.get('TooOld') or ''),str(a.get('AgeInMinutes') or '')))
          print('TOTAL_FEATURES',len(all_rows),'UNIQUE_CAMERA_LOCATIONS',len(groups))
          lats=[k[0] for k in groups]; lons=[k[1] for k in groups]
          print('BOUNDS',min(lats),max(lats),min(lons),max(lons))
          good=0
          for (lat,lon,name),views in list(groups.items())[:20]:
            direction,url,too_old,age=views[0]
            try:
              q=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'image/*,*/*'})
              with urllib.request.urlopen(q,timeout=15) as r:
                b=r.read(64); ct=str(r.headers.get('Content-Type') or '').lower()
              ok=bool(b) and ('image/' in ct or b.startswith((b'\xff\xd8\xff',b'\x89PNG',b'GIF8')))
              good += int(ok)
              print('CAM',ok,'views',len(views),'age',age,'old',too_old,name,lat,lon)
            except Exception as e:
              print('CAM_ERR',name,e)
          print('GOOD_SAMPLE_LOCATIONS',good)
          PY
