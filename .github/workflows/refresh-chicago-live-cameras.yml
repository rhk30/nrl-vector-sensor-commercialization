name: Refresh Chicago live cameras

on:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-chicago-live-cameras.yml

permissions:
  contents: write

concurrency:
  group: rhkearth-chicago-live-cameras
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out RHKEARTH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover healthy Chicago public camera embeds
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from html import unescape
          import json
          import re
          import time
          import urllib.request

          BASE = 'https://opencctv.org'
          CITY = '/cameras/united-states/illinois/chicago'
          OUT = Path('experimental-data/chicago-live-cameras.json')
          UA = 'RHKEARTH/1.0 (+https://rhkearth.com/experimental/; Chicago public-camera refresh)'

          try:
              previous = json.loads(OUT.read_text(encoding='utf-8')) if OUT.exists() else {}
          except Exception:
              previous = {}
          previous_rows = previous.get('sources') if isinstance(previous, dict) else []
          previous_rows = previous_rows if isinstance(previous_rows, list) else []

          def fetch(url, attempts=3):
              last = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': UA,
                          'Accept': 'text/html,application/xhtml+xml,*/*',
                      })
                      with urllib.request.urlopen(req, timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError(f'HTTP {response.status}')
                          return response.read().decode('utf-8', errors='replace')
                  except Exception as exc:
                      last = exc
                      if attempt + 1 < attempts:
                          time.sleep(0.8 * (attempt + 1))
              raise RuntimeError(f'fetch failed {url}: {last}')

          def clean_html(raw):
              raw = re.sub(r'<script\b.*?</script>', ' ', raw, flags=re.I | re.S)
              raw = re.sub(r'<style\b.*?</style>', ' ', raw, flags=re.I | re.S)
              raw = re.sub(r'<[^>]+>', ' ', raw)
              return re.sub(r'\s+', ' ', unescape(raw)).strip()

          # Discover the current Chicago catalog pages.
          links = []
          seen = set()
          for page in range(1, 13):
              url = f'{BASE}{CITY}' + ('' if page == 1 else f'?page={page}')
              raw = fetch(url)
              page_added = 0
              for href in re.findall(r'href=["\']([^"\']+)["\']', raw, flags=re.I):
                  href = unescape(href).split('#', 1)[0].split('?', 1)[0]
                  if not href.startswith(CITY + '/') or href in seen:
                      continue
                  seen.add(href)
                  links.append(href)
                  page_added += 1
              if page > 1 and page_added == 0:
                  break

          def inspect(href):
              page_url = BASE + href
              try:
                  raw = fetch(page_url)
                  text = clean_html(raw)

                  # Do not publish a marker for a provider page that currently
                  # advertises its feed as unavailable. This was the source of
                  # most of the broken Chicago camera clicks.
                  if re.search(r'Feed\s+unavailable', text, flags=re.I):
                      return None

                  coords = re.search(
                      r'Coordinates\s+(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)',
                      text,
                      flags=re.I,
                  )
                  if not coords:
                      return None
                  lat, lon = float(coords.group(1)), float(coords.group(2))
                  if not (41.45 <= lat <= 42.25 and -88.45 <= lon <= -87.35):
                      return None

                  h1 = re.search(r'<h1[^>]*>(.*?)</h1>', raw, flags=re.I | re.S)
                  name = clean_html(h1.group(1)) if h1 else href.rstrip('/').split('/')[-1].replace('-', ' ').title()
                  cam_id = re.search(r'Camera ID\s+(\d+)', text, flags=re.I)
                  category = re.search(
                      r'Category\s+([A-Za-z][A-Za-z /&-]{0,40}?)(?=\s+Coordinates\b)',
                      text,
                      flags=re.I,
                  )
                  camera_id = cam_id.group(1) if cam_id else href.rstrip('/').split('-')[-1]

                  # Use a direct YouTube embed when the healthy provider page
                  # exposes one. This avoids putting the entire aggregator page
                  # inside RHKEARTH and is much more reliable cross-browser.
                  direct = ''
                  for src in re.findall(r'(?:href|src)=["\']([^"\']+)["\']', raw, flags=re.I):
                      src = unescape(src)
                      if re.match(r'https://(?:www\.)?youtube\.com/embed/[A-Za-z0-9_-]+', src, flags=re.I):
                          direct = src
                          break
                  if not direct:
                      return None

                  return {
                      'id': f'opencctv-{camera_id}',
                      'name': name[:160],
                      'category': category.group(1).strip().lower() if category else 'camera',
                      'lat': lat,
                      'lon': lon,
                      'feedType': 'iframe',
                      'embedUrl': direct,
                      'sourcePage': page_url,
                      'sourceFeedType': 'youtube-embed',
                      'provider': 'Public source via OpenCCTV discovery',
                      'city': 'Chicago',
                      'state': 'Illinois',
                      'country': 'US',
                      'liveSemantics': 'provider-reported live video embed',
                  }
              except Exception as exc:
                  print(f'camera skip {href}: {exc}')
                  return None

          sources = []
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = [pool.submit(inspect, href) for href in links]
              for future in as_completed(futures):
                  row = future.result()
                  if row:
                      sources.append(row)

          sources = sorted(
              {row['id']: row for row in sources}.values(),
              key=lambda row: (row['category'], row['name'], row['id']),
          )

          # If discovery temporarily fails, preserve only a previous catalog
          # that already contains the same direct YouTube-embed contract. Never
          # fall back to the old dead m3u8/page-iframe records.
          if len(sources) < 3:
              fallback = [
                  row for row in previous_rows
                  if str(row.get('feedType') or '').lower() == 'iframe'
                  and re.match(r'https://(?:www\.)?youtube\.com/embed/[A-Za-z0-9_-]+', str(row.get('embedUrl') or ''), flags=re.I)
              ]
              if len(fallback) >= 3:
                  sources = fallback
                  print(f'health discovery short read; retained {len(sources)} last-good direct embeds')

          if len(sources) < 3:
              raise SystemExit(
                  f'Only {len(sources)} healthy direct Chicago camera embeds found; refusing to publish a degraded catalog'
              )

          OUT.parent.mkdir(exist_ok=True)
          OUT.write_text(json.dumps({
              'sources': sources,
              'fetchedAt': int(datetime.now(timezone.utc).timestamp() * 1000),
              'source': 'Currently healthy public Chicago camera embeds',
              'policy': 'Only provider pages reporting an available feed and exposing a direct YouTube embed are published.',
              'catalogCandidates': len(links),
              'healthyDirectEmbeds': len(sources),
          }, separators=(',', ':'), ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'Chicago healthy direct embeds: {len(sources)} of {len(links)} catalog candidates')
          for row in sources:
              print(row['name'], row['embedUrl'])
          PY

      - name: Validate Chicago camera embeds
        run: |
          test -s experimental-data/chicago-live-cameras.json
          python - <<'PY'
          import json
          import re
          import urllib.request

          data = json.load(open('experimental-data/chicago-live-cameras.json'))
          rows = data.get('sources') or []

          assert len(rows) >= 3, f'only {len(rows)} healthy Chicago cameras'
          assert len({r.get('id') for r in rows}) == len(rows), 'duplicate Chicago camera ids'
          assert all(str(r.get('feedType', '')).lower() == 'iframe' for r in rows)
          assert all(re.match(r'https://(?:www\.)?youtube\.com/embed/[A-Za-z0-9_-]+', str(r.get('embedUrl') or ''), flags=re.I) for r in rows)
          assert all(41.45 <= float(r['lat']) <= 42.25 and -88.45 <= float(r['lon']) <= -87.35 for r in rows)

          reachable = 0
          for row in rows:
              req = urllib.request.Request(row['embedUrl'], headers={
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'text/html,application/xhtml+xml,*/*',
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      if response.status == 200:
                          reachable += 1
              except Exception as exc:
                  print('embed probe failed:', row.get('id'), exc)
          assert reachable >= max(2, len(rows) - 1), f'only {reachable}/{len(rows)} direct embeds reachable'
          print('validated', len(rows), 'healthy Chicago direct embeds;', reachable, 'embed pages reachable')
          PY

      - name: Commit refreshed Chicago camera catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp experimental-data/chicago-live-cameras.json /tmp/chicago-live-cameras.json

          for attempt in 1 2 3; do
            echo "Camera publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p experimental-data experimental/live-data
            cp /tmp/chicago-live-cameras.json experimental-data/chicago-live-cameras.json
            cp /tmp/chicago-live-cameras.json experimental/live-data/chicago-live-cameras.json
            git add experimental-data/chicago-live-cameras.json experimental/live-data/chicago-live-cameras.json

            if git diff --cached --quiet; then
              echo "Chicago camera catalog already current."
              exit 0
            fi

            git commit -m "Refresh healthy Chicago camera embeds [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "Remote advanced during camera refresh; retrying."
          done

          echo "Could not publish Chicago cameras after three attempts."
          exit 1
