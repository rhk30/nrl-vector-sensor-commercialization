name: Refresh Illinois and Indiana roadway cameras

on:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-chicago-live-cameras.yml

permissions:
  contents: write

concurrency:
  group: rhkearth-il-in-roadway-cameras
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out RHKEARTH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Illinois and Indiana roadway-camera catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import urlencode, urljoin
          import hashlib, json, re, urllib.request

          OUT = Path('experimental-data/chicago-live-cameras.json')
          UA = 'RHKEARTH/1.0 (+https://rhkearth.com/experimental/; public roadway camera catalog)'

          def request(url, *, body=None, headers=None, timeout=35):
              h = {'User-Agent': UA, 'Accept': 'application/json,image/*,*/*'}
              if headers: h.update(headers)
              req = urllib.request.Request(url, data=body, headers=h, method='POST' if body is not None else 'GET')
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  if not 200 <= response.status < 300: raise RuntimeError(f'HTTP {response.status}: {url}')
                  return response.read()

          def stable_id(prefix, lat, lon, name):
              d = hashlib.sha1(f'{lat:.6f}|{lon:.6f}|{name}'.encode()).hexdigest()[:14]
              return f'{prefix}-{d}'

          sources, counts = [], {}

          # Indiana statewide — INDOT TrafficWise / 511IN.
          gql = '''query MapFeatures($input: MapFeaturesArgs!) {
            mapFeaturesQuery(input: $input) { mapFeatures {
              title uri features { geometry } __typename
              ... on Camera { active views(limit: 4) { category ... on CameraView { url } } }
            } }
          }'''
          body = json.dumps({'query': gql, 'variables': {'input': {
              'north': 41.9, 'south': 37.7, 'east': -84.6, 'west': -88.2,
              'zoom': 16, 'layerSlugs': ['normalCameras'], 'nonClusterableUris': None,
          }}}).encode()
          p = json.loads(request('https://511in.org/api/graphql', body=body, headers={
              'Content-Type': 'application/json', 'Referer': 'https://511in.org/'
          }).decode())
          feats = (((p.get('data') or {}).get('mapFeaturesQuery') or {}).get('mapFeatures') or [])
          in_count = 0
          for i, f in enumerate(feats):
              if f.get('__typename') != 'Camera' or f.get('active') is False: continue
              geoms = f.get('features') or []
              coords = (((geoms[0] if geoms else {}).get('geometry') or {}).get('coordinates') or [])
              if len(coords) < 2: continue
              try: lon, lat = float(coords[0]), float(coords[1])
              except (TypeError, ValueError): continue
              if not (37.7 <= lat <= 41.9 and -88.2 <= lon <= -84.6): continue
              views = []
              for v in f.get('views') or []:
                  u = str(v.get('url') or '').strip(); low = u.lower()
                  if not u.startswith('https://') or '.m3u8' in low or 'youtube.com' in low or 'youtu.be' in low: continue
                  if u not in [x['url'] for x in views]: views.append({'label': str(v.get('category') or 'Camera'), 'url': u})
              if not views: continue
              m = re.search(r'camera/(\d+)', str(f.get('uri') or '')); cid = m.group(1) if m else str(i)
              sources.append({
                  'id': f'indot-{cid}', 'name': str(f.get('title') or f'INDOT Camera {cid}')[:180],
                  'category': 'traffic', 'lat': lat, 'lon': lon, 'feedType': 'image',
                  'url': views[0]['url'], 'snapshotUrl': views[0]['url'], 'mediaUrl': views[0]['url'],
                  'views': views, 'refreshMs': 30000, 'provider': 'INDOT TrafficWise / 511IN',
                  'city': 'Indiana', 'state': 'IN', 'country': 'US',
                  'sourceKind': 'official-state-dot-camera', 'liveSemantics': 'near-real-time roadway CCTV image'
              }); in_count += 1
          counts['INDOT TrafficWise / 511IN'] = in_count

          # Illinois statewide/public network — IDOT Travel Midwest ArcGIS view.
          tm = 'https://services2.arcgis.com/aIrBD8yn1TDTEXoz/arcgis/rest/services/TrafficCamerasTM_Public/FeatureServer/0/query'
          groups, offset, directional = {}, 0, 0
          while offset < 10000:
              q = urlencode({
                  'where': 'y > 36.9 AND y < 42.6 AND x > -91.6 AND x < -87.0',
                  'outFields': 'OBJECTID,CameraLocation,CameraDirection,y,x,SnapShot,WarningAge,TooOld,AgeInMinutes',
                  'returnGeometry': 'false', 'f': 'json', 'resultRecordCount': '1000',
                  'resultOffset': str(offset), 'orderByFields': 'OBJECTID ASC'
              })
              d = json.loads(request(tm + '?' + q).decode())
              if d.get('error'): raise RuntimeError(d['error'])
              page = d.get('features') or []; directional += len(page)
              for f in page:
                  a = f.get('attributes') or {}
                  try: lat, lon = float(a.get('y')), float(a.get('x'))
                  except (TypeError, ValueError): continue
                  u = str(a.get('SnapShot') or '').strip()
                  if '/IL-' not in u.upper() or not u.startswith('https://'): continue
                  if str(a.get('TooOld') or '').lower() == 'true': continue
                  name = str(a.get('CameraLocation') or '').strip()
                  if not name: continue
                  key = (round(lat, 6), round(lon, 6), name)
                  g = groups.setdefault(key, {'lat': lat, 'lon': lon, 'name': name, 'views': [], 'ages': []})
                  direction = str(a.get('CameraDirection') or '').strip().upper() or f'View {len(g["views"])+1}'
                  if u not in [x['url'] for x in g['views']]: g['views'].append({'label': direction, 'url': u})
                  try: g['ages'].append(int(a.get('AgeInMinutes')))
                  except (TypeError, ValueError): pass
              if not page or (len(page) < 1000 and not d.get('exceededTransferLimit')): break
              offset += len(page)

          idot_count = 0
          for g in groups.values():
              views = g['views']
              if not views: continue
              lat, lon, name = g['lat'], g['lon'], g['name']
              sources.append({
                  'id': stable_id('idot-tm', lat, lon, name), 'name': name[:180],
                  'category': 'traffic', 'lat': lat, 'lon': lon, 'feedType': 'image',
                  'url': views[0]['url'], 'snapshotUrl': views[0]['url'], 'mediaUrl': views[0]['url'],
                  'views': views, 'refreshMs': 30000, 'provider': 'IDOT / Travel Midwest Public Camera Layer',
                  'city': 'Illinois', 'state': 'IL', 'country': 'US',
                  'sourceKind': 'official-public-state-camera-layer',
                  'ageMinutes': min(g['ages']) if g['ages'] else None,
                  'liveSemantics': 'near-real-time roadway CCTV image'
              }); idot_count += 1
          counts['IDOT / Travel Midwest Public Camera Layer'] = idot_count
          counts['IDOT directional records scanned'] = directional

          # Illinois Tollway official public camera network — additional coverage.
          cfg = json.loads(request('https://www.illinoisvirtualtollway.com/config.json', headers={
              'Referer': 'https://www.illinoisvirtualtollway.com/'
          }).decode())
          map_url = str((cfg.get('services') or {}).get('mapURL') or '').rstrip('/')
          layer = (cfg.get('layers') or {}).get('camerasLayerID')
          image_base = str((cfg.get('trafficCameras') or {}).get('baseURL') or '')
          if not map_url or layer is None or not image_base.startswith('https://'): raise RuntimeError('Illinois Tollway config incomplete')
          q = urlencode({'where': '1=1', 'outFields': '*', 'returnGeometry': 'true', 'outSR': '4326', 'f': 'json'})
          td = json.loads(request(f'{map_url}/{layer}/query?{q}', headers={'Referer': 'https://www.illinoisvirtualtollway.com/'}).decode())
          if td.get('error'): raise RuntimeError(td['error'])
          toll_count = 0
          for f in td.get('features') or []:
              a, geom = f.get('attributes') or {}, f.get('geometry') or {}
              try:
                  lat = float(a.get('latitude') if a.get('latitude') is not None else geom.get('y'))
                  lon = float(a.get('longitude') if a.get('longitude') is not None else geom.get('x'))
              except (TypeError, ValueError): continue
              views = []
              for n in range(1, 9):
                  rel = str(a.get(f'Ap{n}File') or '').strip()
                  if not rel: continue
                  u = urljoin(image_base if image_base.endswith('/') else image_base + '/', rel)
                  label = str(a.get(f'Ap{n}Desc') or a.get(f'Ap{n}Dir') or f'View {n}').strip()
                  if u.startswith('https://') and u not in [x['url'] for x in views]: views.append({'label': label, 'url': u})
              if not views: continue
              oid = a.get('OBJECTID') or a.get('CamID') or toll_count
              name = str(a.get('DisplayName') or a.get('CamDesc') or f'Illinois Tollway Camera {oid}')
              sources.append({
                  'id': f'illinois-tollway-{oid}', 'name': name[:180], 'category': 'traffic',
                  'lat': lat, 'lon': lon, 'feedType': 'image', 'url': views[0]['url'],
                  'snapshotUrl': views[0]['url'], 'mediaUrl': views[0]['url'], 'views': views,
                  'refreshMs': 300000, 'provider': 'Illinois Tollway / Virtual Tollway',
                  'city': 'Illinois Tollway', 'state': 'IL', 'country': 'US',
                  'roadway': str(a.get('Road') or ''), 'milepost': a.get('MP'),
                  'sourceKind': 'official-public-tollway-camera', 'liveSemantics': 'provider-refreshed roadway CCTV image'
              }); toll_count += 1
          counts['Illinois Tollway / Virtual Tollway'] = toll_count

          sources = list({str(r['id']): r for r in sources}.values())
          sources.sort(key=lambda r: (r.get('state',''), r.get('provider',''), r.get('name',''), r['id']))
          if in_count < 300: raise SystemExit(f'INDOT catalog unexpectedly small: {in_count}')
          if idot_count < 800: raise SystemExit(f'IDOT usable Illinois catalog unexpectedly small: {idot_count}')
          if toll_count < 20: raise SystemExit(f'Illinois Tollway catalog unexpectedly small: {toll_count}')

          OUT.parent.mkdir(exist_ok=True)
          OUT.write_text(json.dumps({
              'sources': sources, 'fetchedAt': int(datetime.now(timezone.utc).timestamp()*1000),
              'source': 'Official/public Illinois and Indiana roadway camera layers', 'providerCounts': counts,
              'coverage': 'Indiana statewide via INDOT TrafficWise; Illinois via IDOT/Travel Midwest public ArcGIS cameras plus Illinois Tollway cameras.',
              'policy': 'Roadway CCTV snapshots only. No YouTube or generic webcams. Stale IDOT views flagged TooOld are excluded; directional views are grouped per camera.'
          }, separators=(',', ':'), ensure_ascii=False) + '\n')
          print('provider counts', counts, 'total markers', len(sources))
          PY

      - name: Validate real roadway camera images
        run: |
          test -s experimental-data/chicago-live-cameras.json
          python - <<'PY'
          import json, urllib.request
          data = json.load(open('experimental-data/chicago-live-cameras.json'))
          rows = data.get('sources') or []
          groups = {
              'INDOT': [r for r in rows if r.get('provider') == 'INDOT TrafficWise / 511IN'],
              'IDOT': [r for r in rows if r.get('provider') == 'IDOT / Travel Midwest Public Camera Layer'],
              'TOLLWAY': [r for r in rows if r.get('provider') == 'Illinois Tollway / Virtual Tollway'],
          }
          assert len(groups['INDOT']) >= 300
          assert len(groups['IDOT']) >= 800
          assert len(groups['TOLLWAY']) >= 20
          assert all(str(r.get('feedType') or '').lower() == 'image' for r in rows)
          assert not any('youtube.com' in json.dumps(r).lower() or 'youtu.be' in json.dumps(r).lower() for r in rows)
          assert len({r.get('id') for r in rows}) == len(rows)

          def camera_ok(row):
              for view in row.get('views') or [{'url': row['snapshotUrl']}]:
                  try:
                      req = urllib.request.Request(view['url'], headers={'User-Agent':'Mozilla/5.0','Accept':'image/*,*/*'})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          b = response.read(64); ct = str(response.headers.get('Content-Type') or '').lower()
                      if b and ('image/' in ct or b.startswith((b'\xff\xd8\xff', b'\x89PNG', b'GIF8'))): return True
                  except Exception as exc:
                      print('view failed', row.get('id'), view.get('label'), exc)
              return False

          minimum = {'INDOT':4, 'IDOT':4, 'TOLLWAY':3}
          for label, group in groups.items():
              sample = group[:5]; good = sum(camera_ok(r) for r in sample)
              assert good >= minimum[label], f'{label}: {good}/{len(sample)} sample cameras reachable'
              print(label, good, '/', len(sample), 'sample cameras reachable')
          print('validated real roadway CCTV', {k:len(v) for k,v in groups.items()}, 'total', len(rows))
          PY

      - name: Commit refreshed regional roadway-camera catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp experimental-data/chicago-live-cameras.json /tmp/chicago-live-cameras.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p experimental-data experimental/live-data
            cp /tmp/chicago-live-cameras.json experimental-data/chicago-live-cameras.json
            cp /tmp/chicago-live-cameras.json experimental/live-data/chicago-live-cameras.json
            git add experimental-data/chicago-live-cameras.json experimental/live-data/chicago-live-cameras.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh Illinois and Indiana roadway cameras [skip ci]"
            if git push origin main; then exit 0; fi
          done
          exit 1
