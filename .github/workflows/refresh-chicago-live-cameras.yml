name: Refresh Chicago live cameras

on:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-chicago-live-cameras.yml

permissions:
  contents: write

concurrency:
  group: rhkearth-chicago-live-cameras
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out RHKEARTH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build validated Chicago direct-embed roster
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          OUT = Path('experimental-data/chicago-live-cameras.json')

          # These were individually validated from the current Chicago public-camera
          # catalog on 2026-09-10. Keeping the direct media target avoids two known
          # failure modes: dead OpenCCTV catalog pages and rate-limited bulk crawling.
          sources = [
              {
                  'id': 'opencctv-140379',
                  'name': '4K LIVE CAM: Midway Airport | Chicago, IL USA | StreamTime LIVE',
                  'category': 'airport',
                  'lat': 41.7868,
                  'lon': -87.7522,
                  'feedType': 'iframe',
                  'embedUrl': 'https://www.youtube.com/embed/67BCsiW-1Io',
                  'sourcePage': 'https://opencctv.org/cameras/united-states/illinois/chicago/4k-live-cam-midway-airport-or-chicago-il-usa-or-streamtime-live-140379',
                  'sourceFeedType': 'youtube-embed',
                  'provider': 'Public source via OpenCCTV discovery',
                  'city': 'Chicago',
                  'state': 'Illinois',
                  'country': 'US',
                  'liveSemantics': 'provider-reported live video embed',
              },
              {
                  'id': 'opencctv-140513',
                  'name': 'Kościół św. Władysława w Chicago',
                  'category': 'city',
                  'lat': 41.9420,
                  'lon': -87.7612,
                  'feedType': 'iframe',
                  'embedUrl': 'https://www.youtube.com/embed/YA9AA6IEyd0',
                  'sourcePage': 'https://opencctv.org/cameras/united-states/illinois/chicago/kosciol-sw-wladyslawa-w-chicago-140513',
                  'sourceFeedType': 'youtube-embed',
                  'provider': 'Public source via OpenCCTV discovery',
                  'city': 'Chicago',
                  'state': 'Illinois',
                  'country': 'US',
                  'liveSemantics': 'provider-reported live video embed',
              },
              {
                  'id': 'opencctv-141255',
                  'name': 'Live Stream - Construction Hotel Chicago',
                  'category': 'city',
                  'lat': 41.8777,
                  'lon': -87.6678,
                  'feedType': 'iframe',
                  'embedUrl': 'https://www.youtube.com/embed/dmEq_ddk0kw',
                  'sourcePage': 'https://opencctv.org/cameras/united-states/illinois/chicago/live-stream-construction-hotel-chicago-141255',
                  'sourceFeedType': 'youtube-embed',
                  'provider': 'Public source via OpenCCTV discovery',
                  'city': 'Chicago',
                  'state': 'Illinois',
                  'country': 'US',
                  'liveSemantics': 'provider-reported live video embed',
              },
              {
                  'id': 'opencctv-141893',
                  'name': 'Livestream from St. Luke Church',
                  'category': 'city',
                  'lat': 41.8885,
                  'lon': -87.8151,
                  'feedType': 'iframe',
                  'embedUrl': 'https://www.youtube.com/embed/XdmdItr9tZc',
                  'sourcePage': 'https://opencctv.org/cameras/united-states/illinois/chicago/livestream-from-st-luke-church-141893',
                  'sourceFeedType': 'youtube-embed',
                  'provider': 'Public source via OpenCCTV discovery',
                  'city': 'Chicago',
                  'state': 'Illinois',
                  'country': 'US',
                  'liveSemantics': 'provider-reported live video embed',
              },
          ]

          OUT.parent.mkdir(exist_ok=True)
          OUT.write_text(json.dumps({
              'sources': sources,
              'fetchedAt': int(datetime.now(timezone.utc).timestamp() * 1000),
              'source': 'Validated direct Chicago public-camera embeds',
              'policy': 'Small direct-media roster; no bulk OpenCCTV crawl and no dead catalog-page iframes.',
              'healthyDirectEmbeds': len(sources),
          }, separators=(',', ':'), ensure_ascii=False) + '\n', encoding='utf-8')
          print('Chicago stable direct embeds:', len(sources))
          PY

      - name: Validate Chicago direct embeds
        run: |
          test -s experimental-data/chicago-live-cameras.json
          python - <<'PY'
          import json
          import re
          import urllib.request

          data = json.load(open('experimental-data/chicago-live-cameras.json'))
          rows = data.get('sources') or []

          assert len(rows) == 4, f'expected 4 Chicago cameras, got {len(rows)}'
          assert len({r.get('id') for r in rows}) == len(rows), 'duplicate Chicago camera ids'
          assert all(str(r.get('feedType', '')).lower() == 'iframe' for r in rows)
          assert all(re.match(r'https://(?:www\.)?youtube\.com/embed/[A-Za-z0-9_-]+$', str(r.get('embedUrl') or ''), flags=re.I) for r in rows)
          assert all(41.45 <= float(r['lat']) <= 42.25 and -88.45 <= float(r['lon']) <= -87.35 for r in rows)

          # Probe the actual media targets, not the aggregator pages. A temporary
          # provider-side block must not erase the last-good roster, so the build
          # records reachability but does not collapse the catalog on one transient.
          reachable = 0
          for row in rows:
              req = urllib.request.Request(row['embedUrl'], headers={
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'text/html,application/xhtml+xml,*/*',
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      if response.status == 200:
                          reachable += 1
              except Exception as exc:
                  print('embed probe warning:', row.get('id'), exc)
          print('validated', len(rows), 'Chicago direct embeds;', reachable, 'embed targets reachable from runner')
          PY

      - name: Commit refreshed Chicago camera catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp experimental-data/chicago-live-cameras.json /tmp/chicago-live-cameras.json

          for attempt in 1 2 3; do
            echo "Camera publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p experimental-data experimental/live-data
            cp /tmp/chicago-live-cameras.json experimental-data/chicago-live-cameras.json
            cp /tmp/chicago-live-cameras.json experimental/live-data/chicago-live-cameras.json
            git add experimental-data/chicago-live-cameras.json experimental/live-data/chicago-live-cameras.json

            if git diff --cached --quiet; then
              echo "Chicago camera catalog already current."
              exit 0
            fi

            git commit -m "Refresh stable Chicago camera embeds [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "Remote advanced during camera refresh; retrying."
          done

          echo "Could not publish Chicago cameras after three attempts."
          exit 1
