name: Refresh Illinois and Indiana roadway cameras

on:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-chicago-live-cameras.yml

permissions:
  contents: write

concurrency:
  group: rhkearth-il-in-roadway-cameras
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out RHKEARTH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Illinois and Indiana roadway-camera catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import urlencode, urljoin
          import hashlib
          import json
          import re
          import urllib.request

          OUT = Path('experimental-data/chicago-live-cameras.json')
          UA = 'RHKEARTH/1.0 (+https://rhkearth.com/experimental/; public roadway camera catalog)'

          def request(url, *, body=None, headers=None, timeout=35):
              merged = {'User-Agent': UA, 'Accept': 'application/json,image/*,*/*'}
              if headers:
                  merged.update(headers)
              req = urllib.request.Request(
                  url,
                  data=body,
                  headers=merged,
                  method='POST' if body is not None else 'GET',
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  if not 200 <= response.status < 300:
                      raise RuntimeError(f'HTTP {response.status}: {url}')
                  return response.read(), dict(response.headers)

          def stable_id(prefix, lat, lon, name):
              digest = hashlib.sha1(f'{lat:.6f}|{lon:.6f}|{name}'.encode('utf-8')).hexdigest()[:14]
              return f'{prefix}-{digest}'

          sources = []
          provider_counts = {}

          # Indiana — statewide INDOT TrafficWise / 511IN public camera map.
          endpoint = 'https://511in.org/api/graphql'
          gql = '''query MapFeatures($input: MapFeaturesArgs!) {
            mapFeaturesQuery(input: $input) {
              mapFeatures {
                title uri features { geometry } __typename
                ... on Camera {
                  active
                  views(limit: 4) {
                    category
                    ... on CameraView { url }
                  }
                }
              }
            }
          }'''
          body = json.dumps({
              'query': gql,
              'variables': {'input': {
                  'north': 41.9, 'south': 37.7, 'east': -84.6, 'west': -88.2,
                  'zoom': 16, 'layerSlugs': ['normalCameras'], 'nonClusterableUris': None,
              }},
          }).encode('utf-8')
          raw, _ = request(endpoint, body=body, headers={
              'Content-Type': 'application/json', 'Referer': 'https://511in.org/',
          })
          payload = json.loads(raw.decode('utf-8'))
          feats = (((payload.get('data') or {}).get('mapFeaturesQuery') or {}).get('mapFeatures') or [])
          in_count = 0
          for i, feature in enumerate(feats):
              if feature.get('__typename') != 'Camera' or feature.get('active') is False:
                  continue
              geoms = feature.get('features') or []
              coords = (((geoms[0] if geoms else {}).get('geometry') or {}).get('coordinates') or [])
              if len(coords) < 2:
                  continue
              try:
                  lon, lat = float(coords[0]), float(coords[1])
              except (TypeError, ValueError):
                  continue
              if not (37.7 <= lat <= 41.9 and -88.2 <= lon <= -84.6):
                  continue
              views = []
              for view in feature.get('views') or []:
                  url = str(view.get('url') or '').strip()
                  low = url.lower()
                  if not url.startswith('https://') or '.m3u8' in low or 'youtube.com' in low or 'youtu.be' in low:
                      continue
                  if url in [v['url'] for v in views]:
                      continue
                  views.append({'label': str(view.get('category') or 'Camera').strip() or 'Camera', 'url': url})
              if not views:
                  continue
              match = re.search(r'camera/(\d+)', str(feature.get('uri') or ''))
              cid = match.group(1) if match else str(i)
              sources.append({
                  'id': f'indot-{cid}',
                  'name': str(feature.get('title') or f'INDOT Camera {cid}')[:180],
                  'category': 'traffic', 'lat': lat, 'lon': lon, 'feedType': 'image',
                  'url': views[0]['url'], 'snapshotUrl': views[0]['url'], 'mediaUrl': views[0]['url'],
                  'views': views, 'refreshMs': 30000,
                  'provider': 'INDOT TrafficWise / 511IN', 'city': 'Indiana', 'state': 'IN', 'country': 'US',
                  'sourceKind': 'official-state-dot-camera',
                  'liveSemantics': 'near-real-time roadway CCTV image',
              })
              in_count += 1
          provider_counts['INDOT TrafficWise / 511IN'] = in_count

          # Illinois — IDOT's public ArcGIS view of Travel Midwest cameras.
          # The service publishes one feature per direction, so collapse E/N/S/W
          # snapshots into one map marker with multiple selectable views.
          tm_query = 'https://services2.arcgis.com/aIrBD8yn1TDTEXoz/arcgis/rest/services/TrafficCamerasTM_Public/FeatureServer/0/query'
          tm_groups = {}
          offset = 0
          tm_feature_count = 0
          while offset < 10000:
              params = {
                  'where': 'y > 36.9 AND y < 42.6 AND x > -91.6 AND x < -87.0',
                  'outFields': 'OBJECTID,CameraLocation,CameraDirection,y,x,SnapShot,WarningAge,TooOld,AgeInMinutes',
                  'returnGeometry': 'false', 'f': 'json', 'resultRecordCount': '1000',
                  'resultOffset': str(offset), 'orderByFields': 'OBJECTID ASC',
              }
              tm_raw, _ = request(tm_query + '?' + urlencode(params))
              tm_payload = json.loads(tm_raw.decode('utf-8'))
              if tm_payload.get('error'):
                  raise RuntimeError(f"IDOT public camera layer error: {tm_payload['error']}")
              page = tm_payload.get('features') or []
              tm_feature_count += len(page)
              for feature in page:
                  attrs = feature.get('attributes') or {}
                  try:
                      lat, lon = float(attrs.get('y')), float(attrs.get('x'))
                  except (TypeError, ValueError):
                      continue
                  snapshot = str(attrs.get('SnapShot') or '').strip()
                  # Keep Illinois-owned/identified records only; the public
                  # Travel Midwest layer also contains neighboring-state rows.
                  if '/IL-' not in snapshot.upper() or not snapshot.startswith('https://'):
                      continue
                  if str(attrs.get('TooOld') or '').strip().lower() == 'true':
                      continue
                  name = str(attrs.get('CameraLocation') or '').strip()
                  if not name:
                      continue
                  key = (round(lat, 6), round(lon, 6), name)
                  group = tm_groups.setdefault(key, {'lat': lat, 'lon': lon, 'name': name, 'views': [], 'ages': []})
                  direction = str(attrs.get('CameraDirection') or '').strip().upper() or f'View {len(group["views"]) + 1}'
                  if snapshot not in [v['url'] for v in group['views']]:
                      group['views'].append({'label': direction, 'url': snapshot})
                  try:
                      group['ages'].append(int(attrs.get('AgeInMinutes')))
                  except (TypeError, ValueError):
                      pass
              if not page:
                  break
              if len(page) < 1000 and not tm_payload.get('exceededTransferLimit'):
                  break
              offset += len(page)

          idot_il_count = 0
          for group in tm_groups.values():
              views = group['views']
              if not views:
                  continue
              lat, lon, name = group['lat'], group['lon'], group['name']
              sources.append({
                  'id': stable_id('idot-tm', lat, lon, name),
                  'name': name[:180], 'category': 'traffic', 'lat': lat, 'lon': lon, 'feedType': 'image',
                  'url': views[0]['url'], 'snapshotUrl': views[0]['url'], 'mediaUrl': views[0]['url'],
                  'views': views, 'refreshMs': 30000,
                  'provider': 'IDOT / Travel Midwest Public Camera Layer',
                  'city': 'Illinois', 'state': 'IL', 'country': 'US',
                  'sourceKind': 'official-public-state-camera-layer',
                  'ageMinutes': min(group['ages']) if group['ages'] else None,
                  'liveSemantics': 'near-real-time roadway CCTV image',
              })
              idot_il_count += 1
          provider_counts['IDOT / Travel Midwest Public Camera Layer'] = idot_il_count
          provider_counts['IDOT directional records'] = tm_feature_count

          # Illinois Tollway — separate official public map, retained as an
          # additional source/fallback for the Tollway network.
          cfg_raw, _ = request('https://www.illinoisvirtualtollway.com/config.json', headers={
              'Referer': 'https://www.illinoisvirtualtollway.com/',
          })
          cfg = json.loads(cfg_raw.decode('utf-8'))
          map_url = str((cfg.get('services') or {}).get('mapURL') or '').rstrip('/')
          camera_layer = (cfg.get('layers') or {}).get('camerasLayerID')
          image_base = str((cfg.get('trafficCameras') or {}).get('baseURL') or '')
          if not map_url or camera_layer is None or not image_base.startswith('https://'):
              raise RuntimeError('Illinois Virtual Tollway camera configuration incomplete')
          query = urlencode({'where': '1=1', 'outFields': '*', 'returnGeometry': 'true', 'outSR': '4326', 'f': 'json'})
          il_raw, _ = request(f'{map_url}/{camera_layer}/query?{query}', headers={
              'Referer': 'https://www.illinoisvirtualtollway.com/',
          })
          il_payload = json.loads(il_raw.decode('utf-8'))
          if il_payload.get('error'):
              raise RuntimeError(f"Illinois Tollway camera service error: {il_payload['error']}")

          tollway_count = 0
          for feature in il_payload.get('features') or []:
              attrs = feature.get('attributes') or {}
              geometry = feature.get('geometry') or {}
              try:
                  lat = float(attrs.get('latitude') if attrs.get('latitude') is not None else geometry.get('y'))
                  lon = float(attrs.get('longitude') if attrs.get('longitude') is not None else geometry.get('x'))
              except (TypeError, ValueError):
                  continue
              views = []
              for n in range(1, 9):
                  rel = str(attrs.get(f'Ap{n}File') or '').strip()
                  if not rel:
                      continue
                  image = urljoin(image_base if image_base.endswith('/') else image_base + '/', rel)
                  if not image.startswith('https://'):
                      continue
                  label = str(attrs.get(f'Ap{n}Desc') or attrs.get(f'Ap{n}Dir') or f'View {n}').strip()
                  if image not in [v['url'] for v in views]:
                      views.append({'label': label or f'View {n}', 'url': image})
              if not views:
                  continue
              oid = attrs.get('OBJECTID') or attrs.get('CamID') or tollway_count
              name = str(attrs.get('DisplayName') or attrs.get('CamDesc') or f'Illinois Tollway Camera {oid}')
              sources.append({
                  'id': f'illinois-tollway-{oid}',
                  'name': name[:180], 'category': 'traffic', 'lat': lat, 'lon': lon, 'feedType': 'image',
                  'url': views[0]['url'], 'snapshotUrl': views[0]['url'], 'mediaUrl': views[0]['url'],
                  'views': views, 'refreshMs': 300000,
                  'provider': 'Illinois Tollway / Virtual Tollway',
                  'city': 'Illinois Tollway', 'state': 'IL', 'country': 'US',
                  'roadway': str(attrs.get('Road') or ''), 'milepost': attrs.get('MP'),
                  'sourceKind': 'official-public-tollway-camera',
                  'liveSemantics': 'provider-refreshed roadway CCTV image',
              })
              tollway_count += 1
          provider_counts['Illinois Tollway / Virtual Tollway'] = tollway_count

          sources = list({str(row['id']): row for row in sources}.values())
          sources.sort(key=lambda row: (row.get('state', ''), row.get('provider', ''), row.get('name', ''), row['id']))

          if in_count < 300:
              raise SystemExit(f'INDOT statewide catalog unexpectedly small: {in_count}')
          if idot_il_count < 1000:
              raise SystemExit(f'IDOT public Illinois catalog unexpectedly small: {idot_il_count}')
          if tollway_count < 20:
              raise SystemExit(f'Illinois Tollway catalog unexpectedly small: {tollway_count}')

          OUT.parent.mkdir(exist_ok=True)
          OUT.write_text(json.dumps({
              'sources': sources,
              'fetchedAt': int(datetime.now(timezone.utc).timestamp() * 1000),
              'source': 'Official/public Illinois and Indiana roadway camera layers',
              'providerCounts': provider_counts,
              'coverage': 'Indiana statewide via INDOT TrafficWise; Illinois via the IDOT/Travel Midwest public ArcGIS camera layer plus Illinois Tollway Virtual Tollway cameras.',
              'policy': 'Roadway CCTV images only. No YouTube, generic webcams, or third-party camera-page embeds. Directional snapshots are grouped into one marker where possible.',
          }, separators=(',', ':'), ensure_ascii=False) + '\n', encoding='utf-8')
          print('provider counts', provider_counts, 'total markers', len(sources))
          PY

      - name: Validate real roadway camera images
        run: |
          test -s experimental-data/chicago-live-cameras.json
          python - <<'PY'
          import json
          import urllib.request

          data = json.load(open('experimental-data/chicago-live-cameras.json'))
          rows = data.get('sources') or []
          groups = {
              'INDOT': [r for r in rows if r.get('provider') == 'INDOT TrafficWise / 511IN'],
              'IDOT': [r for r in rows if r.get('provider') == 'IDOT / Travel Midwest Public Camera Layer'],
              'TOLLWAY': [r for r in rows if r.get('provider') == 'Illinois Tollway / Virtual Tollway'],
          }
          assert len(groups['INDOT']) >= 300, len(groups['INDOT'])
          assert len(groups['IDOT']) >= 1000, len(groups['IDOT'])
          assert len(groups['TOLLWAY']) >= 20, len(groups['TOLLWAY'])
          assert all(str(r.get('feedType') or '').lower() == 'image' for r in rows)
          assert all(str(r.get('snapshotUrl') or '').startswith('https://') for r in rows)
          assert not any('youtube.com' in json.dumps(r).lower() or 'youtu.be' in json.dumps(r).lower() for r in rows)
          assert len({r.get('id') for r in rows}) == len(rows)

          def view_ok(view):
              req = urllib.request.Request(view['url'], headers={
                  'User-Agent': 'Mozilla/5.0 RHKEARTH-camera-validation', 'Accept': 'image/*,*/*',
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  sample = response.read(64)
                  ctype = str(response.headers.get('Content-Type') or '').lower()
                  return response.status == 200 and bool(sample) and (
                      'image/' in ctype or sample.startswith((b'\xff\xd8\xff', b'\x89PNG', b'GIF8'))
                  )

          def camera_ok(row):
              for view in (row.get('views') or [{'url': row['snapshotUrl']}]):
                  try:
                      if view_ok(view):
                          return True
                  except Exception as exc:
                      print('view failed', row.get('id'), view.get('label'), exc)
              return False

          requirements = {'INDOT': 4, 'IDOT': 4, 'TOLLWAY': 3}
          for label, group in groups.items():
              sample = group[:5]
              good = sum(1 for row in sample if camera_ok(row))
              assert good >= requirements[label], f'{label}: only {good}/{len(sample)} sample cameras reachable'
              print(label, 'reachable sample cameras', good, 'of', len(sample))

          print('validated real roadway CCTV markers:', {k: len(v) for k, v in groups.items()}, 'total', len(rows))
          PY

      - name: Commit refreshed regional roadway-camera catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp experimental-data/chicago-live-cameras.json /tmp/chicago-live-cameras.json

          for attempt in 1 2 3; do
            echo "Camera publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p experimental-data experimental/live-data
            cp /tmp/chicago-live-cameras.json experimental-data/chicago-live-cameras.json
            cp /tmp/chicago-live-cameras.json experimental/live-data/chicago-live-cameras.json
            git add experimental-data/chicago-live-cameras.json experimental/live-data/chicago-live-cameras.json

            if git diff --cached --quiet; then
              echo "Illinois/Indiana roadway camera catalog already current."
              exit 0
            fi

            git commit -m "Refresh Illinois and Indiana roadway cameras [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "Remote advanced during camera refresh; retrying."
          done

          echo "Could not publish regional roadway cameras after three attempts."
          exit 1
