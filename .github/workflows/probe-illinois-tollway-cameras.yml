name: Probe Illinois Tollway cameras

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-illinois-tollway-cameras.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Illinois Tollway camera service
        run: |
          python - <<'PY'
          import json, urllib.request
          from urllib.parse import urlencode, urljoin

          base='https://www.illinoisvirtualtollway.com/'
          ua='Mozilla/5.0 RHKEARTH-camera-probe'
          def get(url, accept='application/json,text/plain,*/*'):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':accept,'Referer':base})
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.status,dict(r.headers),r.read()

          st,h,raw=get(urljoin(base,'config.json'))
          cfg=json.loads(raw.decode('utf-8'))
          print('CONFIG',json.dumps(cfg,ensure_ascii=False,indent=2))
          map_url=str((cfg.get('services') or {}).get('mapURL') or '').rstrip('/')
          layer=(cfg.get('layers') or {}).get('camerasLayerID')
          img_base=str((cfg.get('trafficCameras') or {}).get('baseURL') or '')
          print('MAP_URL',map_url)
          print('CAMERA_LAYER',layer)
          print('IMAGE_BASE',img_base)
          if not map_url or layer is None:
              raise SystemExit('Missing public camera service config')

          q=urlencode({'where':'1=1','outFields':'*','returnGeometry':'true','f':'json','outSR':'4326'})
          query_url=f'{map_url}/{layer}/query?{q}'
          st,h,raw=get(query_url)
          data=json.loads(raw.decode('utf-8'))
          print('QUERY_STATUS',st,'FEATURES',len(data.get('features') or []),'ERROR',data.get('error'))
          for f in (data.get('features') or [])[:30]:
              print('FEATURE',json.dumps(f,ensure_ascii=False)[:5000])

          # Probe first available actual camera image composed exactly as the
          # official Virtual Tollway frontend does: baseURL + ApNFile.
          for f in data.get('features') or []:
              a=f.get('attributes') or {}
              for n in range(1,9):
                  rel=str(a.get(f'Ap{n}File') or '').strip()
                  if not rel: continue
                  image=urljoin(img_base if img_base.endswith('/') else img_base+'/',rel)
                  try:
                      ist,ih,ibytes=get(image,'image/*,*/*')
                      print('IMAGE_PROBE',ist,ih.get('Content-Type'),len(ibytes),image)
                      print('IMAGE_CAMERA',a.get('DisplayName'),'DESC',a.get(f'Ap{n}Desc'))
                      raise SystemExit(0)
                  except Exception as e:
                      print('IMAGE_ERR',image,e)
          raise SystemExit('No camera image path found')
          PY
