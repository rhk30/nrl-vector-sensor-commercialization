name: Probe Illinois Tollway cameras

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-illinois-tollway-cameras.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Tollway camera configuration
        run: |
          python - <<'PY'
          import re, urllib.request
          from urllib.parse import urljoin

          base='https://www.illinoisvirtualtollway.com/'
          ua='Mozilla/5.0 RHKEARTH-camera-probe'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,application/javascript,application/json,*/*'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.status,r.headers,r.read().decode('utf-8','replace')

          status,headers,html=get(base)
          print('HOME',status,headers.get('Content-Type'),'bytes',len(html))
          print('SCRIPT TAGS:')
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I):
              url=urljoin(base,src)
              if url not in scripts:scripts.append(url)
              print(url)

          # Print inline snippets around app bootstrap/config so we can find the
          # public map service and camera-image base URL without guessing.
          lowhtml=html.lower()
          for pat in ['appentry','config','settings','mapurl','trafficcameras']:
              pos=lowhtml.find(pat)
              if pos>=0:
                  print('\nHTML MATCH',pat,html[max(0,pos-1000):pos+3000].replace('\n',' ')[:4000])

          for url in scripts:
              try:
                  st,h,text=get(url)
              except Exception as e:
                  print('SCRIPT ERR',url,e);continue
              if 'illinoisvirtualtollway.com' not in url:
                  continue
              print('\n=== LOCAL SCRIPT',url,'bytes',len(text),'===')
              low=text.lower()
              for pat in ['appentry','fetch(','config','settings','mapurl','trafficcameras','baseurl','cameraslayerid','services']:
                  start=0
                  hits=0
                  while hits<5:
                      pos=low.find(pat,start)
                      if pos<0:break
                      print('MATCH',pat,text[max(0,pos-900):pos+2600].replace('\n',' ')[:3500])
                      start=pos+len(pat);hits+=1
              for rel in sorted(set(re.findall(r'["\']([^"\']+\.(?:json|js)(?:\?[^"\']*)?)["\']',text,re.I))):
                  print('ASSET REF',urljoin(base,rel))
          PY
