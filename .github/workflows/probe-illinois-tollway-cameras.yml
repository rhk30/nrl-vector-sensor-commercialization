name: Probe Illinois Tollway cameras

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-illinois-tollway-cameras.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Tollway map assets
        run: |
          python - <<'PY'
          import re, urllib.request
          from urllib.parse import urljoin

          base='https://www.illinoisvirtualtollway.com/'
          ua='Mozilla/5.0 RHKEARTH-camera-probe'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,application/javascript,*/*'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.status,r.headers,r.read().decode('utf-8','replace')

          status,headers,html=get(base)
          print('HOME',status,headers.get('Content-Type'),'bytes',len(html))
          print('HOME SAMPLE',html[:4000].replace('\n',' ')[:4000])
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I):
              url=urljoin(base,src)
              if url not in scripts:scripts.append(url)
          print('SCRIPTS',len(scripts))
          for url in scripts:
              try:
                  st,h,text=get(url)
              except Exception as e:
                  print('SCRIPT ERR',url,e);continue
              low=text.lower()
              if any(k in low for k in ['camera','cctv','trafficcam','traffic_cam']):
                  print('\n=== SCRIPT',url,'bytes',len(text),'===')
                  for pat in ['camera','cctv','trafficcam','traffic_cam','arcgis','featureserver','mapserver']:
                      pos=low.find(pat)
                      if pos>=0:
                          print('MATCH',pat,text[max(0,pos-600):pos+1800].replace('\n',' ')[:2400])
                  urls=sorted(set(re.findall(r'https?://[^"\'\s)]+',text)))
                  for u in urls:
                      if any(k in u.lower() for k in ['camera','arcgis','mapserver','featureserver','tollway']):
                          print('URL',u[:500])
          PY
