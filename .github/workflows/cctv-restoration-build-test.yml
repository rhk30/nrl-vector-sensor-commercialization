name: CCTV restoration build test

on:
  push:
    branches: [restore-cctv-20261030]
    paths:
      - .github/workflows/cctv-restoration-build-test.yml

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      UPSTREAM_COMMIT: 9dfb5369e8bed1531a4bb7e95e247ae9bcaf3961

    steps:
      - name: Check out restoration branch
        uses: actions/checkout@v4
        with:
          ref: restore-cctv-20261030
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Fetch pinned upstream source
        run: |
          rm -rf _gev
          git clone --filter=blob:none --no-checkout https://github.com/bilawalsidhu/gods-eye-view.git _gev
          cd _gev
          git checkout "$UPSTREAM_COMMIT"

      - name: Apply current RHKEARTH patches including CCTV
        working-directory: _gev
        run: |
          python ../scripts/patch-experimental-source.py
          python ../scripts/patch-live-runtime.py
          python ../scripts/patch-flight-trails-models.py
          python ../scripts/patch-entity-details.py
          python ../scripts/patch-ais-area-limit.py
          python ../scripts/patch-submarine-cables-osm.py
          python ../scripts/patch-noir-default.py
          python ../scripts/patch-tactical-map-palette.py
          python ../scripts/clean-experimental-ui-source.py
          python ../scripts/remove-experimental-voice.py
          python ../scripts/tune-experimental-cctv.py
          python ../scripts/add-worldwide-cameras.py
          python ../scripts/patch-camera-interactions.py
          python ../scripts/patch-cctv-marker-colors.py

          grep -q "rhk-worldwide-cctv-addon" src/data/worldwideCameras.js
          grep -q "rhk-world-cctv-horizon" src/data/worldwideCameras.js
          grep -q "#A8B989" src/data/cctv.js
          grep -q "#A8B989" src/data/worldwideCameras.js
          grep -q "#E5C777" src/data/cctv.js
          grep -q "directMediaUrl" src/data/cctv.js
          grep -q "mediaRefreshTimer" src/data/cctv.js
          grep -q "RHKEARTH precision trackpad navigation" src/main.js

      - name: Install dependencies and build
        working-directory: _gev
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Validate built camera renderer and restored catalogs
        working-directory: _gev
        run: |
          mkdir -p dist/live-data
          cp ../experimental-data/cctv.json dist/live-data/cctv.json
          cp ../experimental-data/worldwide-cameras.json dist/live-data/worldwide-cameras.json

          grep -R -q "rhk-worldwide-cctv-addon" dist/assets
          grep -R -q "rhk-world-cctv-horizon" dist/assets
          grep -R -q "#A8B989\|#a8b989" dist/assets
          grep -R -q "#E5C777\|#e5c777" dist/assets

          python - <<'PY'
          import json
          from pathlib import Path

          cctv = json.loads(Path('dist/live-data/cctv.json').read_text(encoding='utf-8'))
          world = json.loads(Path('dist/live-data/worldwide-cameras.json').read_text(encoding='utf-8'))
          cctv_rows = cctv.get('sources') or []
          world_rows = world.get('sources') or []

          if len(cctv_rows) < 500:
              raise SystemExit(f'CCTV catalog unexpectedly small: {len(cctv_rows)}')
          if len(world_rows) < 20000:
              raise SystemExit(f'Worldwide catalog unexpectedly small: {len(world_rows)}')
          if cctv.get('disabled') is True or world.get('disabled') is True:
              raise SystemExit('Camera catalog is still marked disabled')

          print(f'PASS: built CCTV renderer with {len(cctv_rows)} CCTV + {len(world_rows)} worldwide camera records')
          PY
