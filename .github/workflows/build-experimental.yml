name: Build native Experimental app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-experimental.yml

permissions:
  contents: write

concurrency:
  group: native-experimental-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      UPSTREAM_COMMIT: 9dfb5369e8bed1531a4bb7e95e247ae9bcaf3961
    steps:
      - name: Check out RHKEARTH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Fetch pinned God's Eye View source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/bilawalsidhu/gods-eye-view.git _gev
          cd _gev
          git checkout "$UPSTREAM_COMMIT"

      - name: Prepare RHKEARTH static build
        working-directory: _gev
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('vite.config.js')
          s = p.read_text()
          needle = "  return {\n    plugins: ["
          if needle not in s:
              raise SystemExit('Could not locate Vite config return block')
          s = s.replace(needle, "  return {\n    base: '/experimental/',\n    plugins: [", 1)
          p.write_text(s)

          blank = {'type': 'FeatureCollection', 'features': []}
          cable_dir = Path('src/data/local_data/telegeography_submarine_cables')
          for name in ('cable-geo.json', 'landing-point-geo.json'):
              (cable_dir / name).write_text(json.dumps(blank, separators=(',', ':')))
          PY

      - name: Install dependencies
        working-directory: _gev
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        working-directory: _gev
        run: npm run build

      - name: Adapt and brand bundle for RHKEARTH
        working-directory: _gev
        run: |
          python - <<'PY'
          from pathlib import Path

          dist = Path('dist')
          text_ext = {'.html', '.js', '.css', '.json', '.svg', '.txt', '.md'}
          replacements = {
              '/models/': '/experimental/models/',
              '"/logo.svg"': '"/experimental/logo.svg"',
              "'/logo.svg'": "'/experimental/logo.svg'",
              '"/mic.svg"': '"/experimental/mic.svg"',
              "'/mic.svg'": "'/experimental/mic.svg'",
              '"/pin.svg"': '"/experimental/pin.svg"',
              "'/pin.svg'": "'/experimental/pin.svg'",
              '"/location.svg"': '"/experimental/location.svg"',
              "'/location.svg'": "'/experimental/location.svg'",
              '"/visual-presets.svg"': '"/experimental/visual-presets.svg"',
              "'/visual-presets.svg'": "'/experimental/visual-presets.svg'",
          }
          for path in dist.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_ext:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new)

          index = dist / 'index.html'
          html = index.read_text()
          html = html.replace('<head>', '<head>\n<meta name="robots" content="noindex,nofollow,noarchive">', 1)
          html = html.replace('<title>God\'s Eye View</title>', '<title>RHKEARTH // Experimental</title>')
          html = html.replace('<span>GOD\'S EYE <span class="title-accent">VIEW</span></span>', '<span>RHKEARTH <span class="title-accent">EXPERIMENTAL</span></span>')
          html = html.replace('<p class="subtitle">NO PLACE LEFT BEHIND</p>', '<p class="subtitle">EXPERIMENTAL SYSTEMS</p>')
          index.write_text(html)

          # Use the existing RHKEARTH brand mark for the page header and favicon.
          brand = Path('../rhkearth-logo.svg')
          if not brand.exists():
              raise SystemExit('RHKEARTH logo not found')
          (dist / 'logo.svg').write_text(brand.read_text())

          for source, target in [
              ('LICENSE', 'UPSTREAM_LICENSE.txt'),
              ('DATA_SOURCES.md', 'DATA_SOURCES.md'),
              ('public/models/README.md', 'MODEL_ATTRIBUTIONS.md'),
          ]:
              src = Path(source)
              if src.exists():
                  (dist / target).write_text(src.read_text())
          PY

      - name: Publish finished app into RHKEARTH
        run: |
          rm -rf experimental
          mkdir -p experimental
          cp -a _gev/dist/. experimental/
          printf '%s\n' "Native static build of bilawalsidhu/gods-eye-view pinned at $UPSTREAM_COMMIT, branded for RHKEARTH Experimental." > experimental/RHKEARTH_BUILD.txt

      - name: Commit native bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental
          if git diff --cached --quiet; then
            echo "No Experimental build changes to commit."
            exit 0
          fi
          git commit -m "Brand native Experimental as RHKEARTH [skip ci]"
          git push
