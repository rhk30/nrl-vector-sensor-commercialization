name: Build native Experimental app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-experimental.yml
      - scripts/prepare-experimental-build.py
      - scripts/patch-experimental-data.py
      - scripts/adapt-experimental-bundle.py

permissions:
  contents: write

concurrency:
  group: native-experimental-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      UPSTREAM_COMMIT: 9dfb5369e8bed1531a4bb7e95e247ae9bcaf3961

    steps:
      - name: Check out RHKEARTH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Fetch pinned upstream source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/bilawalsidhu/gods-eye-view.git _gev
          cd _gev
          git checkout "$UPSTREAM_COMMIT"

      - name: Prepare RHKEARTH source
        working-directory: _gev
        run: |
          python ../scripts/prepare-experimental-build.py
          python ../scripts/patch-experimental-data.py

      - name: Install and build
        working-directory: _gev
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Adapt finished bundle
        working-directory: _gev
        run: python ../scripts/adapt-experimental-bundle.py

      - name: Validate build files and data snapshots
        run: |
          test -f _gev/dist/index.html
          test -f _gev/dist/cesium/Cesium.js
          test -s experimental-data/military.json
          test -s experimental-data/cctv.json
          test -s experimental-data/cctv-health.json
          test -s experimental-data/launches.json
          test -s experimental-data/fires.json
          test -s experimental-data/celestrak/active

      - name: Browser smoke test
        working-directory: _gev
        run: |
          python -m pip install --disable-pip-version-check --quiet selenium
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/rhkearth-experimental-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/experimental/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/experimental/ >/dev/null
          curl -fsS http://127.0.0.1:4173/experimental/cesium/Cesium.js >/dev/null

          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.set_capability('goog:loggingPrefs', {'browser': 'ALL'})

          driver = webdriver.Chrome(options=opts)
          wait = WebDriverWait(driver, 20)
          try:
              driver.set_window_size(1440, 1000)
              driver.get('http://127.0.0.1:4173/experimental/')
              wait.until(lambda d: d.title == 'RHKEARTH // Experimental')
              wait.until(lambda d: 'RHKEARTH' in d.find_element(By.ID, 'title-bar').text)
              loader_text = driver.execute_script(
                  "return document.getElementById('loading-screen')?.textContent || ''"
              )
              if 'RHKEARTH' not in loader_text:
                  raise AssertionError('Startup cover source is not RHKEARTH branded')
              wait.until(lambda d: 'hidden' in (d.find_element(By.ID, 'loading-screen').get_attribute('class') or '').split())
              wait.until(lambda d: d.execute_script('return !!window.__godsEyeView?.viewer'))

              canvas = driver.find_element(By.CSS_SELECTOR, '#cesiumContainer canvas')
              rect = driver.execute_script(
                  'const r=arguments[0].getBoundingClientRect();return [r.width,r.height]', canvas
              )
              if rect[0] < 300 or rect[1] < 200:
                  raise AssertionError(f'Cesium canvas did not render at usable size: {rect}')

              max_zoom = driver.execute_script(
                  'return window.__godsEyeView.viewer.scene.screenSpaceCameraController.maximumZoomDistance'
              )
              if max_zoom < 100_000_000:
                  raise AssertionError(f'Orbital zoom range not applied: {max_zoom}')

              favicon = driver.find_element(By.CSS_SELECTOR, 'link[rel="icon"]').get_attribute('href')
              if not favicon.endswith('/experimental/logo.svg'):
                  raise AssertionError(f'Unexpected favicon: {favicon}')

              serious = []
              for entry in driver.get_log('browser'):
                  msg = entry.get('message', '')
                  if any(token in msg for token in ['Uncaught ', 'SyntaxError', 'ReferenceError', 'TypeError:']):
                      serious.append(msg)
              if serious:
                  raise AssertionError('Runtime JavaScript errors: ' + ' | '.join(serious[:5]))

              print('PASS: RHKEARTH Experimental boots, renders Cesium, and supports orbital zoom')
          finally:
              driver.quit()
          PY

      - name: Publish finished app into RHKEARTH
        run: |
          rm -rf experimental
          mkdir -p experimental
          cp -a _gev/dist/. experimental/
          test -f experimental/cesium/Cesium.js
          test -f experimental/index.html
          printf '%s\n' "Native static build of bilawalsidhu/gods-eye-view pinned at $UPSTREAM_COMMIT, adapted as RHKEARTH Experimental with keyless data adapters, TfL JamCams, and orbital navigation." > experimental/RHKEARTH_BUILD.txt

      - name: Commit native bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental
          if git diff --cached --quiet; then
            echo "No Experimental build changes to commit."
            exit 0
          fi
          git commit -m "Build RHKEARTH Experimental keyless layers [skip ci]"
          git push
