name: Probe remaining US public camera sources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/probe-remaining-us-camera-sources.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe current public schemas
        run: |
          python - <<'PY'
          import json, re, urllib.request
          UA='RHKEARTH/1.0 (+https://rhkearth.com/experimental/; public camera source validation)'
          def fetch(url,timeout=25):
              q=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,text/html,*/*'})
              with urllib.request.urlopen(q,timeout=timeout) as r:return r.read(),r.headers.get('content-type','')
          probes={
            'ALGO':'https://api.algotraffic.com/v4.0/cameras',
            'DELDOT':'https://tmc.deldot.gov/json/videocamera.json',
            'SC511':'https://sc.cdn.iteris-atis.com/geojson/icons/metadata/icons.cameras.geojson',
            'RIDOT':'https://www.dot.ri.gov/travel/',
            'HAWAII':'https://goakamai.org/',
            'WYDOT':'https://www.wyoroad.info/pls/Browse/WRR.Cameras',
            'MARYLAND':'https://chartexp1.sha.maryland.gov/CHARTExportClientService/getCameraMapDataJSON.do',
          }
          for name,url in probes.items():
              print('\n===',name,url,'===')
              try:
                  raw,ctype=fetch(url)
                  print('STATUS bytes',len(raw),'ctype',ctype)
                  txt=raw.decode('utf-8','replace')
                  if 'json' in ctype.lower() or txt.lstrip().startswith(('{','[')):
                      d=json.loads(txt)
                      if isinstance(d,list):
                          print('LIST',len(d),'SAMPLE',json.dumps(d[:1],ensure_ascii=False)[:5000])
                      elif isinstance(d,dict):
                          print('DICT KEYS',list(d.keys())[:30])
                          for k,v in d.items():
                              if isinstance(v,list) and v:
                                  print('ARRAY',k,'LEN',len(v),'SAMPLE',json.dumps(v[:1],ensure_ascii=False)[:5000]);break
                          else: print('SAMPLE',json.dumps(d,ensure_ascii=False)[:5000])
                  else:
                      print('HTML HEAD',re.sub(r'\s+',' ',txt[:7000]))
                      urls=re.findall(r'https?://[^"\'<>\s]+',txt)
                      print('URLS',urls[:40])
                      scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',txt,re.I)
                      print('SCRIPTS',scripts[:30])
                      imgs=re.findall(r'<img[^>]+src=["\']([^"\']+)',txt,re.I)
                      print('IMAGES',imgs[:30])
              except Exception as e: print('ERROR',repr(e))
          PY
