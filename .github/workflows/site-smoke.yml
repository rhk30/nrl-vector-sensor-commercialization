name: site smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install selenium
      - name: Start local site
        run: |
          python -m http.server 8000 >/tmp/rhk-http.log 2>&1 &
          echo $! > /tmp/rhk-http.pid
      - name: Browser smoke test
        run: |
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          def fail(msg):
              print('FAIL:', msg)
              raise AssertionError(msg)

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=opts)
          wait=WebDriverWait(d,20)

          try:
              d.set_window_size(1440,1000)
              d.get('http://127.0.0.1:8000/')
              wait.until(lambda x: x.execute_script('return document.readyState')=='complete')
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.static-tech-head')))
              wait.until(EC.presence_of_element_located((By.ID,'engThetaAnnotation')))
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.market-motion-v10')))
              time.sleep(.8)

              assert d.title=='RHKEARTH'

              # Static technology exhibit replaces the old angle simulator.
              if d.find_elements(By.CSS_SELECTOR,'#angle:not([disabled])'):
                  fail('legacy interactive incidence-angle control is active')
              if d.find_elements(By.ID,'auditDirectivity'):
                  fail('legacy interactive normalized-response card is still present')

              annotation=d.find_element(By.ID,'engThetaAnnotation').text
              assert '20°' in annotation
              assert '+0.940' in annotation
              assert 'ILLUSTRATIVE' in annotation

              cards=d.find_elements(By.CSS_SELECTOR,'.audited-reference-grid .audit-readout')
              if len(cards)!=3:
                  fail(f'expected 3 prototype evidence cards, found {len(cards)}')
              card_text=' '.join(c.text for c in cards)
              assert '20 nm/Pa' in card_text
              assert '530 Hz' in card_text
              assert '100 μPa' in card_text

              # Direction demonstrator still loads its reviewer geometry.
              wait.until(EC.presence_of_element_located((By.ID,'missionBearing')))
              wait.until(EC.presence_of_element_located((By.ID,'incomingWaveVector')))

              bad=[]
              for entry in d.get_log('browser'):
                  m=entry.get('message','')
                  if any(x in m for x in ['Uncaught ','SyntaxError','ReferenceError','TypeError:']) and 'ERR_' not in m:
                      bad.append(m)
              if bad:
                  fail('runtime JS errors: '+' | '.join(bad[:5]))

              # Basic mobile overflow guard.
              d.set_window_size(390,844)
              d.get('http://127.0.0.1:8000/')
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'.static-tech-head')))
              time.sleep(.8)
              overflow=d.execute_script('return {sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,bw:document.body.scrollWidth}')
              if overflow['sw']>overflow['cw']+2 or overflow['bw']>overflow['cw']+2:
                  fail(f'mobile horizontal overflow {overflow}')

              print('PASS: RHKEARTH static technology and demonstrator smoke test')
          finally:
              d.quit()
          PY
