name: Finalize RHKEARTH Experimental UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-rhkearth-experimental-ui.yml
      - scripts/finalize-experimental-ui.py
      - scripts/rhkearth-weather.js
      - scripts/rhkearth-weather.css
      - experimental/rhkearth-runtime.js
      - experimental/rhkearth-theme.css

permissions:
  contents: write

concurrency:
  group: rhkearth-experimental-ui-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize RHKEARTH shell
        run: python scripts/finalize-experimental-ui.py

      - name: Commit finalized interface
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/index.html experimental/rhkearth-weather.js experimental/rhkearth-weather.css
          if git diff --cached --quiet; then
            echo "RHKEARTH Experimental interface already finalized."
            exit 0
          fi
          git commit -m "Finalize RHKEARTH intelligence console [skip ci]"
          git push
