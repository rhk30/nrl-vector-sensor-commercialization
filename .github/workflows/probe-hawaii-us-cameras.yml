name: Probe Hawaii public camera service

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/probe-hawaii-us-cameras.yml

permissions:
  contents: read

jobs:
  probe-hawaii:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GoAkamai camera service
        run: |
          python - <<'PY'
          import json, urllib.request
          UA='RHKEARTH/1.0 (+https://rhkearth.com/experimental/)'
          def grab(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,application/xml,text/xml,*/*'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read(), dict(r.headers), r.geturl()
          urls=[
              'https://a.cameraservice.goakamai.org/cameras?format=mapPage',
              'https://a.cameraservice.goakamai.org/cameras',
              'https://a.cameraservice.goakamai.org/cameras?format=json',
          ]
          for url in urls:
              print('\n===',url,'===')
              try:
                  raw,h,final=grab(url)
                  print('bytes',len(raw),'ctype',h.get('Content-Type'),'final',final)
                  txt=raw.decode('utf-8','replace')
                  print('HEAD',txt[:18000])
                  if txt.lstrip().startswith(('{','[')):
                      d=json.loads(txt)
                      if isinstance(d,list):
                          print('LIST',len(d),'SAMPLE',json.dumps(d[:2],ensure_ascii=False)[:12000])
                      elif isinstance(d,dict):
                          print('KEYS',list(d.keys())[:50])
                          for k,v in d.items():
                              if isinstance(v,list):
                                  print('ARRAY',k,len(v),'SAMPLE',json.dumps(v[:2],ensure_ascii=False)[:12000])
              except Exception as e:
                  print('ERROR',repr(e))
          PY
