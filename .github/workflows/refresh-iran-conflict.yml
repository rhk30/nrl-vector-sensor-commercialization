name: Refresh strategic Iran conflict reports

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/refresh-iran-conflict.py
      - .github/workflows/refresh-iran-conflict.yml

permissions:
  contents: write

concurrency:
  group: rhkearth-iran-strategic-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect public reports and validate snapshot
        run: |
          python scripts/refresh-iran-conflict.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('experimental-data/iran-conflict.json')
          d = json.loads(p.read_text())
          assert d['schemaVersion'] == 1
          assert d['status'] in {'ok','partial','stale','unavailable'}
          assert all(x['articleUrl'].startswith('https://') and x['verification'] == 'unverified-report' for x in d['items'])
          assert json.loads(Path('experimental/live-data/iran-conflict.json').read_text()) == d
          print('Validated strategic reporting snapshot:',d['status'],d['itemCount'])
          PY
      - name: Publish snapshot with retry on competing writers
        run: |
          cp experimental-data/iran-conflict.json /tmp/iran-conflict.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p experimental-data experimental/live-data
            cp /tmp/iran-conflict.json experimental-data/iran-conflict.json
            cp /tmp/iran-conflict.json experimental/live-data/iran-conflict.json
            git add experimental-data/iran-conflict.json experimental/live-data/iran-conflict.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh strategic Iran conflict source inventory [skip ci]"
            if git push origin main; then exit 0; fi
            sleep "$attempt"
          done
          echo "Could not publish after four attempts" >&2
          exit 1
