name: Experimental integrity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/experimental-integrity.yml
      - experimental/**
      - experimental-data/**

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test dependency
        run: pip install --disable-pip-version-check --quiet selenium

      - name: Start static RHKEARTH site
        run: |
          python -m http.server 8000 >/tmp/rhkearth-experimental-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/experimental/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/rhkearth-experimental-http.log
          exit 1

      - name: Validate Experimental assets and boot
        run: |
          curl -fsS http://127.0.0.1:8000/experimental/cesium/Cesium.js >/dev/null
          curl -fsS 'http://127.0.0.1:8000/experimental/rhkearth-runtime.js?v=2' >/dev/null
          curl -fsS 'http://127.0.0.1:8000/experimental/rhkearth-theme.css?v=2' >/dev/null
          curl -fsS http://127.0.0.1:8000/experimental-data/military.json >/dev/null
          curl -fsS http://127.0.0.1:8000/experimental-data/celestrak/starlink >/dev/null
          curl -fsS http://127.0.0.1:8000/experimental-data/launches.json >/dev/null
          curl -fsS http://127.0.0.1:8000/experimental-data/cctv.json >/dev/null
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.common.exceptions import TimeoutException

          options = Options()
          options.page_load_strategy = 'eager'
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          options.set_capability('goog:loggingPrefs', {'browser': 'ALL'})

          driver = webdriver.Chrome(options=options)
          driver.set_page_load_timeout(25)
          wait = WebDriverWait(driver, 45)
          try:
              driver.set_window_size(1440, 1000)
              try:
                  driver.get('http://127.0.0.1:8000/experimental/')
              except TimeoutException:
                  # Outside imagery/font providers must not decide whether the
                  # native RHKEARTH shell itself counts as booted.
                  pass

              wait.until(lambda d: d.title == 'RHKEARTH // Intelligence Console')
              wait.until(lambda d: d.execute_script('return !!window.__godsEyeView?.viewer'))
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, '#cesiumContainer canvas')) > 0)

              html = driver.page_source
              if 'js.puter.com' in html:
                  raise AssertionError('Puter script is still present')
              if driver.find_elements(By.ID, 'first-run-launcher'):
                  raise AssertionError('First-run greeter is still present')

              canvas = driver.find_element(By.CSS_SELECTOR, '#cesiumContainer canvas')
              width, height = driver.execute_script(
                  'const r=arguments[0].getBoundingClientRect(); return [r.width,r.height]', canvas
              )
              if width < 300 or height < 200:
                  raise AssertionError(f'Cesium canvas unusable: {width}x{height}')

              title = driver.find_element(By.ID, 'title-bar').text.upper()
              if 'RHKEARTH' not in title or 'INTELLIGENCE CONSOLE' not in title:
                  raise AssertionError('RHKEARTH title shell is missing')

              serious = []
              for entry in driver.get_log('browser'):
                  msg = entry.get('message', '')
                  if any(token in msg for token in ('Uncaught ', 'SyntaxError', 'ReferenceError')):
                      serious.append(msg)
              if serious:
                  raise AssertionError('Experimental runtime errors: ' + ' | '.join(serious[:5]))

              print('PASS: RHKEARTH Experimental boots with Cesium, RHKEARTH shell, and no login/onboarding prompt')
          finally:
              driver.quit()
          PY
