name: Refresh Experimental data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-experimental-data.yml

permissions:
  contents: write

concurrency:
  group: rhkearth-experimental-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out RHKEARTH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh public data snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import json
          import time
          import urllib.parse
          import urllib.request

          ROOT = Path('experimental-data')
          TLE = ROOT / 'celestrak'
          ROOT.mkdir(exist_ok=True)
          TLE.mkdir(exist_ok=True)
          UA = 'RHKEARTH-Experimental/1.0 (+https://rhkearth.com/experimental/)'

          def get_bytes(url, timeout=30, attempts=3):
              last = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': UA,
                          'Accept': '*/*',
                      })
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          if response.status < 200 or response.status >= 300:
                              raise RuntimeError(f'HTTP {response.status} for {url}')
                          return response.read()
                  except Exception as exc:
                      last = exc
                      if attempt + 1 < attempts:
                          time.sleep(2 ** attempt)
              raise RuntimeError(f'Failed to fetch {url}: {last}')

          def get_json(url):
              return json.loads(get_bytes(url).decode('utf-8'))

          def write_json(path, payload):
              Path(path).write_text(json.dumps(payload, separators=(',', ':'), ensure_ascii=False) + '\n')

          now = datetime.now(timezone.utc)
          now_ms = int(now.timestamp() * 1000)

          # Military ADS-B snapshot. adsb.lol publishes this under ODbL 1.0.
          military = get_json('https://api.adsb.lol/v2/mil')
          if not isinstance(military.get('ac'), list):
              raise RuntimeError('adsb.lol military payload missing ac array')
          write_json(ROOT / 'military.json', military)

          # Launch Library 2 rolling 30-day mission catalog.
          start = now - timedelta(days=30)
          launch_params = urllib.parse.urlencode({
              'net__gte': start.isoformat().replace('+00:00', 'Z'),
              'net__lte': now.isoformat().replace('+00:00', 'Z'),
              'limit': '100',
              'mode': 'detailed',
          })
          launches = get_json('https://ll.thespacedevs.com/2.3.0/launches/?' + launch_params)
          if not isinstance(launches.get('results'), list):
              raise RuntimeError('Launch Library payload missing results array')
          write_json(ROOT / 'launches.json', launches)

          # Keyless wildfire fallback: NASA EONET event locations. This is NOT
          # FIRMS thermal-detection telemetry, so the frontend labels it EONET.
          eonet = get_json(
              'https://eonet.gsfc.nasa.gov/api/v3/events?category=wildfires&status=open&days=30&limit=500'
          )
          fire_rows = []
          for event in eonet.get('events') or []:
              geometries = event.get('geometry') or []
              if not geometries:
                  continue
              geom = geometries[-1]
              coords = geom.get('coordinates')
              gtype = geom.get('type')
              lat = lon = None
              if gtype == 'Point' and isinstance(coords, list) and len(coords) >= 2:
                  lon, lat = coords[0], coords[1]
              elif gtype == 'Polygon' and isinstance(coords, list) and coords:
                  ring = coords[0] if isinstance(coords[0], list) else []
                  pts = [p for p in ring if isinstance(p, list) and len(p) >= 2]
                  if pts:
                      lon = sum(float(p[0]) for p in pts) / len(pts)
                      lat = sum(float(p[1]) for p in pts) / len(pts)
              try:
                  lat = float(lat)
                  lon = float(lon)
              except (TypeError, ValueError):
                  continue

              date_text = str(geom.get('date') or now.isoformat())
              try:
                  dt = datetime.fromisoformat(date_text.replace('Z', '+00:00'))
              except ValueError:
                  dt = now
              # Populate the FIRMS adapter's common coordinate/time fields while
              # leaving FRP at zero: EONET does not claim thermal radiative power.
              fire_rows.append({
                  'lat': lat,
                  'lon': lon,
                  'frp': 0,
                  'confidence': 60,
                  'brightness': 0,
                  'daynight': '',
                  'acqDate': dt.strftime('%Y-%m-%d'),
                  'acqTime': dt.strftime('%H%M'),
                  'instrument': 'EONET',
                  'satellite': 'NASA EONET',
                  'eventId': event.get('id'),
                  'title': event.get('title'),
              })
          write_json(ROOT / 'fires.json', {
              'fires': fire_rows,
              'fetchedAt': now_ms,
              'stale': False,
              'source': 'NASA EONET',
          })

          # CelesTrak asks consumers not to hammer GP data. Refresh the catalog
          # no more often than every six hours; positions are propagated locally
          # by satellite.js between snapshots.
          meta_path = TLE / 'meta.json'
          try:
              old_meta = json.loads(meta_path.read_text())
              last_tle_ms = int(old_meta.get('fetchedAt') or 0)
          except Exception:
              last_tle_ms = 0

          if now_ms - last_tle_ms >= 6 * 60 * 60 * 1000:
              groups = ['stations', 'visual', 'gps-ops', 'glo-ops', 'galileo', 'geo', 'starlink', 'active']
              for group in groups:
                  params = urllib.parse.urlencode({'GROUP': group, 'FORMAT': 'tle'})
                  body = get_bytes('https://celestrak.org/NORAD/elements/gp.php?' + params, timeout=40)
                  text = body.decode('utf-8', errors='strict').strip()
                  if len(text.splitlines()) < 3:
                      raise RuntimeError(f'CelesTrak group {group} returned too little data')
                  (TLE / group).write_text(text + '\n')
              write_json(meta_path, {'fetchedAt': now_ms, 'source': 'CelesTrak'})

          write_json(ROOT / 'meta.json', {
              'fetchedAt': now_ms,
              'military': 'adsb.lol snapshot',
              'launches': 'Launch Library 2 snapshot',
              'fires': 'NASA EONET wildfire-event snapshot',
          })
          print(f"military={len(military['ac'])} launches={len(launches['results'])} fires={len(fire_rows)}")
          PY

      - name: Validate snapshots
        run: |
          test -s experimental-data/military.json
          test -s experimental-data/launches.json
          test -s experimental-data/fires.json
          test -s experimental-data/celestrak/stations
          test -s experimental-data/celestrak/active

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental-data
          if git diff --cached --quiet; then
            echo "Experimental data already current."
            exit 0
          fi
          git commit -m "Refresh RHKEARTH Experimental data snapshots"
          git push
