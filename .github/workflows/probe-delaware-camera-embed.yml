name: Probe Delaware public camera viewer embedding

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/probe-delaware-camera-embed.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect DelDOT public camera pages
        run: |
          python - <<'PY'
          import json,re,urllib.request
          UA='RHKEARTH/1.0 (+https://rhkearth.com/experimental/)'
          def grab(url):
              q=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,application/json,*/*'})
              with urllib.request.urlopen(q,timeout=25) as r:return r.read(),dict(r.headers),r.geturl()
          d=json.loads(grab('https://tmc.deldot.gov/json/videocamera.json')[0])
          cams=[c for c in d.get('videoCameras') or [] if c.get('enabled') is not False and str(c.get('status') or 'Active').lower()=='active']
          print('active',len(cams))
          for c in cams[:3]:
              cid=c.get('id');url=f'https://deldot.gov/Traffic/cameras/index.shtml?cameraID={cid}&dc=viewer'
              print('\nCAM',cid,c.get('title'),c.get('lat'),c.get('lon'),url)
              try:
                  raw,h,final=grab(url);txt=raw.decode('utf-8','replace')
                  print('bytes',len(raw),'ctype',h.get('Content-Type'),'x-frame',h.get('X-Frame-Options'),'csp',h.get('Content-Security-Policy'),'final',final)
                  print('video refs',re.findall(r'https?://[^"\'<>\s]+(?:m3u8|mp4)[^"\'<>\s]*',txt,re.I)[:8])
                  print('iframe refs',re.findall(r'<iframe[^>]+src=["\']([^"\']+)',txt,re.I)[:8])
                  print('HEAD',re.sub(r'\s+',' ',txt[:4000]))
              except Exception as e:print('ERROR',repr(e))
          PY
